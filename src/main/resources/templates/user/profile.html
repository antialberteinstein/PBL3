<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/base}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/user/profile.css}">
    <!-- Thêm vào phần head -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div layout:fragment="content">
        <div class="profile-container">
            <div class="profile-header">
                <h2>Thông Tin Cá Nhân</h2>
                <button id="editProfileBtn" class="edit-button"><i class="fas fa-edit"></i> Chỉnh sửa</button>
            </div>
            
            <!-- Avatar section -->
            <div class="avatar-section">
                <div class="avatar-container">
                    <img id="profileAvatar" th:src="${session.user != null && session.user.avatarUrl != null ? session.user.avatarUrl : '/images/default-avatar.png'}" 
                         alt="Avatar" class="avatar-image">
                    <div class="avatar-overlay">
                        <label for="avatar-upload" class="avatar-upload-label">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="avatar-upload" class="avatar-upload-input" accept="image/*">
                    </div>
                </div>
                <h3 id="profileName" class="user-name">Đang tải...</h3>
                <p class="user-since">Thành viên siêu cấp Vippro</p>
            </div>
            
            <!-- Profile content section -->
            <div class="profile-content">
                <!-- Thông tin cá nhân -->
                <div class="info-field">
                    <div class="info-label">
                        <i class="fas fa-user"></i>
                        <span>Họ và tên</span>
                    </div>
                    <div id="profileFullName" class="info-value">Đang tải...</div>
                </div>
                
                <div class="info-field">
                    <div class="info-label">
                        <i class="fas fa-envelope"></i>
                        <span>Email</span>
                    </div>
                    <div id="profileEmail" class="info-value">Đang tải...</div>
                </div>
                
                <div class="info-field">
                    <div class="info-label">
                        <i class="fas fa-phone"></i>
                        <span>Số điện thoại</span>
                    </div>
                    <div id="profilePhone" class="info-value">Đang tải...</div>
                </div>
                
                <div class="info-field">
                    <div class="info-label">
                        <i class="fas fa-birthday-cake"></i>
                        <span>Ngày sinh</span>
                    </div>
                    <div id="profileBirthday" class="info-value">Đang tải...</div>
                </div>
                
                <div class="info-field">
                    <div class="info-label">
                        <i class="fas fa-lock"></i>
                        <span>Mật khẩu</span>
                    </div>
                    <div class="info-value password-value">••••••••••</div>
                    <button id="changePasswordBtn" class="change-password-btn">Đổi mật khẩu</button>
                </div>
            </div>
        </div>

        <!-- Edit Profile Modal -->
        <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editProfileModalLabel">Chỉnh sửa thông tin</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editProfileForm">
                            <div class="mb-3">
                                <label for="editName" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="editName" name="name">
                            </div>
                            <div class="mb-3">
                                <label for="editEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail" name="email">
                            </div>
                            <div class="mb-3">
                                <label for="editPhone" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="editPhone" name="phone">
                            </div>
                            <div class="mb-3">
                                <label for="editBirthday" class="form-label">Ngày sinh</label>
                                <input type="date" class="form-control" id="editBirthday" name="birthday">
                            </div>
                        </form>
                        <div id="editProfileMessage" class="alert d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="saveProfileBtn">Lưu thay đổi</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Change Password Modal -->
        <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="changePasswordModalLabel">Đổi mật khẩu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword">
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword">
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword">
                            </div>
                        </form>
                        <div id="changePasswordMessage" class="alert d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="savePasswordBtn">Lưu thay đổi</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded - initializing profile page');
    
    // Khai báo các biến modal
    let editProfileModal;
    let changePasswordModal;
    
    // Khởi tạo modal ngay đây, không lồng nhau
    try {
        if (typeof bootstrap !== 'undefined') {
            editProfileModal = new bootstrap.Modal(document.getElementById('editProfileModal'));
            changePasswordModal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
            console.log('Bootstrap Modals initialized successfully');
        } else {
            console.error('Bootstrap không được tải - không thể khởi tạo modal');
        }
    } catch (error) {
        console.error('Lỗi khởi tạo modal:', error);
    }
    
    // Biến lưu thông tin người dùng
    let currentUser = null;
    
    // Hàm hiển thị thông báo
    function showMessage(elementId, message, isSuccess) {
        const messageElement = document.getElementById(elementId);
        if (!messageElement) {
            console.error('Element not found:', elementId);
            return;
        }
        messageElement.textContent = message;
        messageElement.classList.remove('d-none', 'alert-success', 'alert-danger');
        messageElement.classList.add(isSuccess ? 'alert-success' : 'alert-danger');
    }
    
    // Hàm format ngày sinh
    function formatBirthday(dateString) {
        if (!dateString) return 'Chưa cập nhật';
        
        try {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                // Xử lý trường hợp chuỗi ngày đã định dạng sẵn
                return dateString;
            }
            return date.toLocaleDateString('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        } catch (e) {
            console.error('Error formatting date:', e);
            return dateString; // Trả về chuỗi gốc nếu không thể định dạng
        }
    }
    
    // Hàm format ngày sinh cho input date
    function formatDateForInput(dateString) {
        if (!dateString) return '';
        
        try {
            // Kiểm tra nếu chuỗi có định dạng dd/MM/yyyy
            if (dateString.includes('/')) {
                const parts = dateString.split('/');
                if (parts.length === 3) {
                    // Chuyển từ dd/MM/yyyy sang yyyy-MM-dd
                    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }
            
            const date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return '';
            }
            return date.toISOString().split('T')[0]; // Format YYYY-MM-DD
        } catch (e) {
            console.error('Error formatting date for input:', e);
            return '';
        }
    }
    
    // Hàm tải thông tin người dùng
    function loadUserProfile() {
        console.log('Đang tải thông tin người dùng...');
        fetch('/api/user/profile')
            .then(response => {
                console.log('API response status:', response.status);
                if (!response.ok) {
                    throw new Error('Không thể tải thông tin người dùng');
                }
                return response.json();
            })
            .then(user => {
                console.log('User data received:', user);
                currentUser = user;
                
                // Cập nhật UI
                document.getElementById('profileName').textContent = user.name || 'Chưa cập nhật';
                document.getElementById('profileFullName').textContent = user.name || 'Chưa cập nhật';
                document.getElementById('profileEmail').textContent = user.email || 'Chưa cập nhật';
                document.getElementById('profilePhone').textContent = user.phoneNumber || 'Chưa cập nhật';
                document.getElementById('profileBirthday').textContent = formatBirthday(user.dateOfBirth);
                
                // ⚠️ Fix: Đúng tên trường avatarUrl
                if (user.avatarUrl) {
                    document.getElementById('profileAvatar').src = user.avatarUrl;
                }
                
                // Điền thông tin vào form chỉnh sửa
                document.getElementById('editName').value = user.name || '';
                document.getElementById('editEmail').value = user.email || '';
                document.getElementById('editPhone').value = user.phoneNumber || '';
                document.getElementById('editBirthday').value = formatDateForInput(user.dateOfBirth);
            })
            .catch(error => {
                console.error('Error loading user profile:', error);
            });
    }
    
    // Cập nhật avatar
    document.getElementById('avatar-upload').addEventListener('change', function() {
        console.log('Avatar file selected');
        if (this.files && this.files[0]) {
            const formData = new FormData();
            formData.append('avatar', this.files[0]);
            
            fetch('/api/user/profile/update-avatar', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Avatar update response:', data);
                if (data.success) {
                    // Cập nhật ảnh đại diện
                    document.getElementById('profileAvatar').src = data.avatarUrl;
                    
                    // Hiển thị thông báo thành công
                    alert('Cập nhật ảnh đại diện thành công');
                } else {
                    alert('Lỗi: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error updating avatar:', error);
                alert('Có lỗi xảy ra khi cập nhật ảnh đại diện');
            });
        }
    });
    
    // Mở modal chỉnh sửa thông tin
    document.getElementById('editProfileBtn').addEventListener('click', function() {
        console.log('Edit button clicked');
        try {
            if (editProfileModal) {
                editProfileModal.show();
                console.log('Modal should be visible now');
            } else {
                console.error('Modal không được khởi tạo');
                alert('Không thể mở chức năng chỉnh sửa. Vui lòng làm mới trang và thử lại.');
            }
        } catch (error) {
            console.error('Error showing modal:', error);
        }
    });
    
    // Lưu thông tin cá nhân
    document.getElementById('saveProfileBtn').addEventListener('click', function() {
        const formData = new FormData();
        
        const name = document.getElementById('editName').value;
        const email = document.getElementById('editEmail').value;
        const phoneNumber= document.getElementById('editPhone').value;
        const dateOfBirth = document.getElementById('editBirthday').value;
        
        if (name) formData.append('name', name);
        if (email) formData.append('email', email);
        if (phoneNumber) formData.append('phoneNumber', phoneNumber);
        if (dateOfBirth) formData.append('dateOfBirth', dateOfBirth);

        fetch('/api/user/profile/update', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Cập nhật UI
                loadUserProfile();
                
                // Đóng modal
                editProfileModal.hide();
                
                // Hiển thị thông báo thành công
                alert('Cập nhật thông tin thành công');
            } else {
                showMessage('editProfileMessage', 'Lỗi: ' + data.message, false);
            }
        })
        .catch(error => {
            console.error('Error updating profile:', error);
            showMessage('editProfileMessage', 'Có lỗi xảy ra khi cập nhật thông tin', false);
        });
    });
    
    // Mở modal đổi mật khẩu
    document.getElementById('changePasswordBtn').addEventListener('click', function() {
        console.log('Change password button clicked');
        // Reset form
        document.getElementById('changePasswordForm').reset();
        document.getElementById('changePasswordMessage').classList.add('d-none');
        
        try {
            if (changePasswordModal) {
                changePasswordModal.show();
            } else {
                console.error('Change password modal không được khởi tạo');
                alert('Không thể mở chức năng đổi mật khẩu. Vui lòng làm mới trang và thử lại.');
            }
        } catch (error) {
            console.error('Error showing change password modal:', error);
        }
    });
    
    // Lưu mật khẩu mới
    document.getElementById('savePasswordBtn').addEventListener('click', function() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!currentPassword || !newPassword || !confirmPassword) {
            showMessage('changePasswordMessage', 'Vui lòng điền đầy đủ thông tin', false);
            return;
        }
        
        if (newPassword !== confirmPassword) {
            showMessage('changePasswordMessage', 'Mật khẩu mới và xác nhận mật khẩu không khớp', false);
            return;
        }
        
        const formData = new FormData();
        formData.append('currentPassword', currentPassword);
        formData.append('newPassword', newPassword);
        formData.append('confirmPassword', confirmPassword);
        
        fetch('/api/user/profile/change-password', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Đóng modal
                changePasswordModal.hide();
                
                // Hiển thị thông báo thành công
                alert('Đổi mật khẩu thành công');
            } else {
                showMessage('changePasswordMessage', 'Lỗi: ' + (data.message || 'Đổi mật khẩu không thành công'), false);
            }
        })
        .catch(error => {
            console.error('Error changing password:', error);
            showMessage('changePasswordMessage', 'Có lỗi xảy ra khi đổi mật khẩu', false);
        });
    });
    
    // Tải thông tin người dùng khi trang được tải
    loadUserProfile();
});
</script>
    </th:block>
    <!-- Đặt ở cuối body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
