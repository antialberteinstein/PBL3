<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/base}">
<head>
    <title>Sản phẩm - Shoppie Food</title>
    <link rel="stylesheet" th:href="@{/css/user/home.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <!-- Search Section -->
        <div class="search-section">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <input id="searchInput" type="text" class="form-control" placeholder="Nhập tên món ăn..." aria-label="Tìm kiếm món ăn" />
                        <button id="searchBtn" class="btn" type="button">Tìm kiếm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Categories Section -->
        <div class="category-section mt-4">
            <h4>Danh mục</h4>
            <div class="d-flex flex-wrap" id="categoryBadges">
                <span class="category-badge active" data-category="all">Tất cả</span>
                <!-- Categories will be loaded here -->
            </div>
        </div>

        <!-- Filter options -->
        <div class="filter-options mb-4 mt-4">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <select class="form-select" id="priceFilter">
                        <option value="">Giá</option>
                        <option value="1">Dưới 30,000đ</option>
                        <option value="2">30,000đ - 50,000đ</option>
                        <option value="3">50,000đ - 100,000đ</option>
                        <option value="4">Trên 100,000đ</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <select class="form-select" id="ratingFilter">
                        <option value="">Đánh giá</option>
                        <option value="5">5 sao</option>
                        <option value="4">4 sao trở lên</option>
                        <option value="3">3 sao trở lên</option>
                        <option value="2">2 sao trở lên</option>
                        <option value="1">1 sao trở lên</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <select class="form-select" id="sortOrder">
                        <option value="">Sắp xếp</option>
                        <option value="price_asc">Giá: thấp đến cao</option>
                        <option value="price_desc">Giá: cao đến thấp</option>
                        <option value="popularity">Phổ biến nhất</option>
                        <option value="newest">Mới nhất</option>
                        <option value="oldest">Cũ nhất</option>
                        <option value="rating">Đánh giá cao nhất</option>
                        <option value="rating_low">Đánh giá thấp nhất</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Food List/Grid -->
        <div class="row" id="foodList"></div>
    </div>
<!-- Script for filtering, searching, and sorting -->
<script>
function renderCategories(categories) {
    const container = document.getElementById('categoryBadges');
    // Keep the "Tất cả" badge
    container.innerHTML = '<span class="category-badge active" data-category="all">Tất cả</span>';
    categories.forEach(cat => {
        container.innerHTML += `<span class="category-badge" data-category="${cat.id}">${cat.name}</span>`;
    });

    // Re-attach event listeners for new badges
    const badges = container.querySelectorAll('.category-badge');
    badges.forEach(badge => {
        badge.addEventListener('click', function() {
            badges.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            fetchAndRenderProducts(getFilterParams());
        });
    });
}

function renderProducts(products) {
    const foodList = document.getElementById('foodList');
    
    // Kiểm tra xem foodList có tồn tại không
    if (!foodList) {
        console.error('Element with ID "foodList" not found');
        return;
    }
    
    // Đặt loading indicator
    foodList.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-3">Đang tải món ăn...</p></div>';
    
    // Console log để debug
    console.log('Products data:', products);
    
    if (!products || !Array.isArray(products) || products.length === 0) {
        foodList.innerHTML = '<div class="col-12 text-center text-muted">Không tìm thấy món ăn phù hợp</div>';
        return;
    }
    
    foodList.innerHTML = '';
    products.forEach(product => {
        // Tránh lỗi khi giá trị trong product là null
        const productId = product.productId || 0;
        const name = product.name || 'Không có tên';
        const price = product.price || 0;
        const imageUrl = product.imageUrl || '/images/no-image.png';
        const restaurantName = (product.restaurantName || 'Không có tên nhà hàng').replace(/'/g, "\\'");
        const restaurantId = product.restaurantId || 0;
        const description = (product.description || '').replace(/'/g, "\\'");
        const rating = product.rating || 0;
        const ratingNumber = product.ratingNumber || 0;
        const categories = product.categories ? product.categories.join(', ') : '';
        
        const cardHtml = `
        <div class="col-md-4 mb-4">
            <div class="card food-card" data-category="${categories}" data-price="${price}" data-popularity="${product.popularity || 0}">
                <img src="${imageUrl}" class="card-img-top food-image" alt="${name}" onerror="this.src='/images/no-image.png'">
                <div class="restaurant-badge">${restaurantName}</div>
                <div class="card-body food-info">
                    <h5 class="card-title food-name">${name}</h5>
                    <p class="card-text">${description}</p>
                    <div class="rating">
                        <div class="stars">${'★'.repeat(Math.round(rating)).padEnd(5, '☆')}</div>
                        <div class="count">(${ratingNumber})</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="price food-price">${price.toLocaleString('vi-VN')}đ</span>
                        <button class="btn btn-outline-primary btn-add-cart" 
                            onclick="addToCart(${productId}, '${name.replace(/'/g, "\\'")}', ${price}, '${imageUrl}', '${restaurantName}', ${restaurantId})">
                            Đặt món
                        </button>
                    </div>
                </div>
            </div>
        </div>`;
        
        foodList.insertAdjacentHTML('beforeend', cardHtml);
    });
}

function getFilterParams() {
    const selectedBadge = document.querySelector('.category-badge.active');
    let categoryId = null;
    if (selectedBadge && selectedBadge.dataset.category !== 'all') {
        categoryId = selectedBadge.dataset.category;
    }
    let minPrice = null, maxPrice = null;
    const priceVal = document.getElementById('priceFilter').value;
    switch (priceVal) {
        case "1": maxPrice = 30000; break;
        case "2": minPrice = 30000; maxPrice = 50000; break;
        case "3": minPrice = 50000; maxPrice = 100000; break;
        case "4": minPrice = 100000; break;
    }
    let minRating = null;
    const ratingVal = document.getElementById('ratingFilter').value;
    if (ratingVal) minRating = parseInt(ratingVal);
    let sortBy = "postedAt", sortDir = "desc";
    const sortVal = document.getElementById('sortOrder').value;
    switch (sortVal) {
        case "price_asc": sortBy = "price"; sortDir = "asc"; break;
        case "price_desc": sortBy = "price"; sortDir = "desc"; break;
        case "popularity": sortBy = "popular"; sortDir = "desc"; break;
        case "newest": sortBy = "postedAt"; sortDir = "desc"; break;
        case "oldest": sortBy = "postedAt"; sortDir = "asc"; break;
        case "rating": sortBy = "rating"; sortDir = "desc"; break;
        case "rating_low": sortBy = "rating"; sortDir = "asc"; break;
    }
    return {
        categoryId,
        search: document.getElementById('searchInput').value.trim(),
        minPrice,
        maxPrice,
        minRating,
        sortBy,
        sortDir
    };
}

function fetchAndRenderProducts(params = {}) {
    const foodList = document.getElementById('foodList');
    if (foodList) {
        // Hiển thị loading
        foodList.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-3">Đang tải món ăn...</p></div>';
    }
    
    Object.keys(params).forEach(k => (params[k] == null || params[k] === '') && delete params[k]);
    const query = new URLSearchParams(params).toString();
    
    console.log('Fetching products with query:', query);
    
    fetch('/api/products?' + query)
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP error! Status: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            console.log('API response:', data);
            // Kiểm tra cấu trúc dữ liệu
            const products = data.content || data || [];
            renderProducts(products);
        })
        .catch(error => {
            console.error('Error fetching products:', error);
            if (foodList) {
                foodList.innerHTML = `
                    <div class="col-12 text-center">
                        <div class="alert alert-danger">
                            Có lỗi xảy ra khi tải danh sách món ăn. Vui lòng thử lại sau.
                        </div>
                        <button class="btn btn-primary" onclick="fetchAndRenderProducts()">
                            <i class="fas fa-sync-alt"></i> Tải lại
                        </button>
                    </div>
                `;
            }
        });
}

function addToCart(productId, productName, productPrice, productImage, restaurantName, restaurantId) {
    // Kiểm tra tham số đầu vào
    console.log('Adding to cart:', { productId, productName, productPrice, restaurantName, restaurantId });
    
    if (!productId || !restaurantId) {
        console.error('Missing required parameters for addToCart');
        showToast('Có lỗi xảy ra khi thêm vào giỏ hàng');
        return;
    }
    
    // Lấy giỏ hàng từ localStorage hoặc khởi tạo mới
    let cart = JSON.parse(localStorage.getItem('cart')) || {
        items: [],
        restaurantId: null,
        restaurantName: null,
        total: 0
    };
    
    // Kiểm tra nếu đặt từ nhà hàng khác
    if (cart.items.length > 0 && cart.restaurantId !== restaurantId) {
        if (!confirm("Bạn đang có món ăn từ nhà hàng khác trong giỏ hàng. Xóa giỏ hàng hiện tại và thêm món này?")) {
            return;
        }
        cart = {
            items: [],
            restaurantId: null,
            restaurantName: null,
            total: 0
        };
    }
    
    // Thêm sản phẩm vào giỏ hàng
    const existingItem = cart.items.find(item => item.productId === productId);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.items.push({
            productId,
            name: productName,
            price: productPrice,
            image: productImage,
            quantity: 1
        });
    }
    
    // Cập nhật thông tin nhà hàng và tổng tiền
    cart.restaurantId = restaurantId;
    cart.restaurantName = restaurantName;
    cart.total = cart.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
    
    // Lưu giỏ hàng và cập nhật UI
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    
    // Hiển thị thông báo
    showToast('Đã thêm sản phẩm vào giỏ hàng');
}

// Hiển thị giỏ hàng
function showCart() {
    const cart = JSON.parse(localStorage.getItem('cart')) || { items: [] };
    const cartItemsContainer = document.getElementById('cart-items');
    const cartTotalElement = document.getElementById('cart-total');
    const emptyCartMessage = document.getElementById('empty-cart-message');
    const cartContent = document.getElementById('cart-content');
    
    if (!cart.items || cart.items.length === 0) {
        emptyCartMessage.classList.remove('d-none');
        cartContent.classList.add('d-none');
        return;
    }
    
    emptyCartMessage.classList.add('d-none');
    cartContent.classList.remove('d-none');
    
    cartItemsContainer.innerHTML = '';
    cart.items.forEach(item => {
        const itemElement = document.createElement('div');
        itemElement.className = 'cart-item d-flex justify-content-between align-items-center mb-3';
        itemElement.innerHTML = `
            <div class="d-flex align-items-center">
                <img src="${item.image}" alt="${item.name}" class="cart-item-image me-2">
                <div>
                    <h6 class="mb-0">${item.name}</h6>
                    <div class="price">${item.price.toLocaleString('vi-VN')}đ</div>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <div class="quantity-control">
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateCartItemQuantity(${item.productId}, -1)">-</button>
                    <span class="mx-2">${item.quantity}</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="updateCartItemQuantity(${item.productId}, 1)">+</button>
                </div>
                <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeCartItem(${item.productId})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        cartItemsContainer.appendChild(itemElement);
    });
    
    cartTotalElement.textContent = cart.total.toLocaleString('vi-VN') + 'đ';
    loadUserAddresses();
}

// Cập nhật số lượng sản phẩm trong giỏ hàng
function updateCartItemQuantity(productId, change) {
    const cart = JSON.parse(localStorage.getItem('cart'));
    const item = cart.items.find(item => item.productId === productId);
    
    if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
            // Xóa sản phẩm khỏi giỏ hàng nếu số lượng <= 0
            cart.items = cart.items.filter(i => i.productId !== productId);
        }
        
        // Cập nhật tổng tiền
        cart.total = cart.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
        
        // Lưu giỏ hàng và cập nhật UI
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
        showCart();
    }
}

// Xóa sản phẩm khỏi giỏ hàng
function removeCartItem(productId) {
    const cart = JSON.parse(localStorage.getItem('cart'));
    cart.items = cart.items.filter(item => item.productId !== productId);
    
    // Cập nhật tổng tiền
    cart.total = cart.items.reduce((sum, item) => sum + item.price * item.quantity, 0);
    
    // Lưu giỏ hàng và cập nhật UI
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    showCart();
}

// Cập nhật số lượng sản phẩm hiển thị trên biểu tượng giỏ hàng
function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('cart')) || { items: [] };
    const totalItems = cart.items.reduce((sum, item) => sum + item.quantity, 0);
    const badge = document.getElementById('cart-badge');
    
    if (badge) {
        if (totalItems > 0) {
            badge.textContent = totalItems;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }
}

// Tải địa chỉ của người dùng
function loadUserAddresses() {
    const addressContainer = document.getElementById('address-list');
    
    // Hiển thị loading
    addressContainer.innerHTML = `
        <div class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p>Đang tải địa chỉ...</p>
        </div>
    `;
    
    fetch('/api/user/addresses')
        .then(response => response.json())
        .then(data => {
            addressContainer.innerHTML = '';
            
            if (data.length === 0) {
                addressContainer.innerHTML = `
                    <div class="alert alert-warning">
                        Bạn chưa có địa chỉ nào. Vui lòng thêm địa chỉ để tiếp tục.
                    </div>
                `;
                return;
            }
            
            data.forEach((address, index) => {
                const addressItem = document.createElement('div');
                addressItem.className = 'form-check mb-2';
                addressItem.innerHTML = `
                    <input class="form-check-input" type="radio" name="delivery-address" 
                           id="address-${address.id}" value="${address.id}" ${index === 0 ? 'checked' : ''}>
                    <label class="form-check-label" for="address-${address.id}">
                        <strong>${address.receiverName}</strong> | ${address.phone}
                        <div>${address.fullAddress}</div>
                    </label>
                `;
                addressContainer.appendChild(addressItem);
            });
        })
        .catch(error => {
            console.error('Error loading addresses:', error);
            addressContainer.innerHTML = `
                <div class="alert alert-danger">
                    Có lỗi xảy ra khi tải địa chỉ. Vui lòng thử lại sau.
                </div>
            `;
        });
}

// Gửi đơn hàng đến server
function checkout() {
    // Lấy giỏ hàng từ localStorage
    const cart = JSON.parse(localStorage.getItem('cart'));
    if (!cart || !cart.items || cart.items.length === 0) {
        alert('Giỏ hàng của bạn đang trống');
        return;
    }
    
    // Lấy địa chỉ giao hàng từ modal
    const selectedAddressId = document.querySelector('input[name="delivery-address"]:checked')?.value;
    if (!selectedAddressId) {
        alert('Vui lòng chọn địa chỉ giao hàng');
        return;
    }
    
    // Lấy ghi chú đơn hàng
    const note = document.getElementById('order-note').value;
    
    // Hiển thị loading
    document.getElementById('place-order-btn').disabled = true;
    document.getElementById('place-order-btn').innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Đang xử lý...';
    
    // Tạo dữ liệu đơn hàng
    const orderData = {
        restaurantId: cart.restaurantId,
        addressId: parseInt(selectedAddressId),
        note: note,
        items: cart.items.map(item => ({
            productId: item.productId,
            quantity: item.quantity
        }))
    };
    
    // Gửi request đặt hàng
    fetch('/api/orders/user/place', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(orderData)
    })
    .then(response => response.json())
    .then(data => {
        // Khôi phục nút đặt hàng
        document.getElementById('place-order-btn').disabled = false;
        document.getElementById('place-order-btn').innerHTML = 'Xác nhận đặt hàng';
        
        if (data.success) {
            // Xóa giỏ hàng sau khi đặt hàng thành công
            localStorage.removeItem('cart');
            updateCartBadge();
            
            // Đóng modal giỏ hàng
            const cartModal = bootstrap.Modal.getInstance(document.getElementById('cartModal'));
            cartModal.hide();
            
            // Hiển thị modal thông báo thành công
            const successModal = new bootstrap.Modal(document.getElementById('orderSuccessModal'));
            document.getElementById('success-order-id').textContent = data.orderId;
            successModal.show();
        } else {
            alert('Lỗi đặt hàng: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error placing order:', error);
        alert('Có lỗi xảy ra khi đặt hàng. Vui lòng thử lại sau.');
        
        // Khôi phục nút đặt hàng
        document.getElementById('place-order-btn').disabled = false;
        document.getElementById('place-order-btn').innerHTML = 'Xác nhận đặt hàng';
    });
}

// Thêm vào đầu file script
document.addEventListener('DOMContentLoaded', function() {
    // Xóa cache nếu cần
    if (localStorage.getItem('clear-cache') === 'true') {
        console.log('Clearing cache...');
        localStorage.removeItem('clear-cache');
        
        // Xóa các cache không cần thiết (giữ lại giỏ hàng)
        const cart = localStorage.getItem('cart');
        localStorage.clear();
        if (cart) {
            localStorage.setItem('cart', cart);
        }
        
        // Reload trang sau khi xóa cache
        window.location.reload(true);
        return;
    }
    
    console.log("Page loaded, fetching products and categories");
    fetchAndRenderProducts();
    fetch('/api/categories')
        .then(res => res.json())
        .then(data => renderCategories(data));

    // Remove this block, let renderCategories handle badge listeners
    // const categoryBadges = document.querySelectorAll('.category-badge');
    // categoryBadges.forEach(badge => {
    //     badge.addEventListener('click', function() {
    //         categoryBadges.forEach(b => b.classList.remove('active'));
    //         this.classList.add('active');
    //         fetchAndRenderProducts(getFilterParams());
    //     });
    // });

    document.getElementById('priceFilter').addEventListener('change', function() {
        fetchAndRenderProducts(getFilterParams());
    });
    document.getElementById('ratingFilter').addEventListener('change', function() {
        fetchAndRenderProducts(getFilterParams());
    });
    document.getElementById('sortOrder').addEventListener('change', function() {
        fetchAndRenderProducts(getFilterParams());
    });

    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    if (searchBtn && searchInput) {
        searchBtn.addEventListener('click', function() {
            fetchAndRenderProducts(getFilterParams());
        });
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchAndRenderProducts(getFilterParams());
        });
    }

    updateCartBadge();
    
    // Thêm sự kiện cho nút giỏ hàng
    const cartBtn = document.getElementById('cart-btn');
    if (cartBtn) {
        cartBtn.addEventListener('click', function() {
            showCart();
        });
    }
    
    // Thêm sự kiện cho nút đặt hàng
    const placeOrderBtn = document.getElementById('place-order-btn');
    if (placeOrderBtn) {
        placeOrderBtn.addEventListener('click', checkout);
    }
});

// Thêm nút xóa cache vào trang (có thể xóa sau khi sửa xong)
function addDebugButtons() {
    const debugContainer = document.createElement('div');
    debugContainer.style.position = 'fixed';
    debugContainer.style.bottom = '20px';
    debugContainer.style.left = '20px';
    debugContainer.style.zIndex = '9999';
    
    const clearCacheBtn = document.createElement('button');
    clearCacheBtn.className = 'btn btn-warning btn-sm';
    clearCacheBtn.innerHTML = '<i class="fas fa-broom"></i> Xóa cache';
    clearCacheBtn.onclick = function() {
        localStorage.setItem('clear-cache', 'true');
        window.location.reload(true);
    };
    
    debugContainer.appendChild(clearCacheBtn);
    document.body.appendChild(debugContainer);
}

// Gọi hàm thêm nút debug (có thể xóa sau khi sửa xong)
document.addEventListener('DOMContentLoaded', function() {
    addDebugButtons();
    // Code khác...
});

// Hàm hiển thị thông báo đã thêm sản phẩm vào giỏ hàng
function showToast(message) {
    const toastContainer = document.getElementById('toast-container');
    if (!toastContainer) {
        // Tạo container cho toast nếu chưa có
        const container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'position-fixed bottom-0 end-0 p-3';
        container.style.zIndex = '1090';
        document.body.appendChild(container);
    }
    
    const toastId = 'toast-' + Date.now();
    const toastHtml = `
        <div id="${toastId}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas fa-check-circle me-2"></i> ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    `;
    
    document.getElementById('toast-container').insertAdjacentHTML('beforeend', toastHtml);
    const toastElement = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
    toast.show();
    
    // Xóa toast sau khi ẩn
    toastElement.addEventListener('hidden.bs.toast', function() {
        this.remove();
    });
}
</script>
</div>
