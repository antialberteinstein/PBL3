<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title th:text="${orderStatus == 'active' ? 'Đơn hàng đang xử lý' : 'Lịch sử đơn hàng'}">Đơn hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- SockJS and STOMP for WebSocket -->
    <script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
</head>
<body>
    <div layout:fragment="content">
        <div class="container mt-4">
            <h3 th:text="${orderStatus == 'active' ? 'Đơn hàng đang xử lý' : 'Lịch sử đơn hàng'}">Đơn hàng</h3>
            
            <!-- Tab navigation -->
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${orderStatus == 'active' ? 'active' : ''}" 
                       th:href="@{/restaurant/order/active}">Đơn hàng đang xử lý</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${orderStatus == 'history' ? 'active' : ''}" 
                       th:href="@{/restaurant/order/history}">Lịch sử đơn hàng</a>
                </li>
            </ul>
            
            <!-- Orders container -->
            <div class="orders-container mt-3">
                <div class="text-center my-5" id="loading">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <p class="mt-2">Đang tải đơn hàng...</p>
                </div>
                
                <div id="no-orders" class="text-center my-5 d-none">
                    <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                    <h5>Không có đơn hàng nào</h5>
                    <p class="text-muted" th:text="${orderStatus == 'active' ? 'Chưa có đơn hàng đang xử lý.' : 'Chưa có lịch sử đơn hàng.'}">Không có đơn hàng.</p>
                </div>
                
                <div id="orders-list" class="d-none">
                    <!-- Orders will be added here dynamically -->
                </div>
                
                <div class="text-center my-4" id="load-more-container" style="display: none;">
                    <button class="btn btn-outline-primary" id="load-more-btn">
                        <span>Tải thêm</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Hidden inputs for JS -->
        <input type="hidden" id="restaurant-id" th:value="${restaurant.restaurantId}">
        <input type="hidden" id="order-status" th:value="${orderStatus}">
        
        <!-- Order item template -->
        <template id="order-template">
            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="order-id fw-bold">Đơn #123</span>
                        <span class="order-status badge"></span>
                    </div>
                    <div class="card-body">
                        <p class="card-text order-date mb-2">Ngày đặt: </p>
                        <p class="card-text order-customer mb-2">Khách hàng: </p>
                        <p class="card-text order-address mb-2">Địa chỉ: </p>
                        <p class="card-text order-amount mb-3">Tổng tiền: </p>
                        
                        <div class="order-actions">
                            <!-- Actions buttons will be added dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </template>
        
        <script th:inline="javascript">
            // JavaScript for calling API and handling infinite scrolling
            document.addEventListener('DOMContentLoaded', function() {
                // Variables
                const ordersList = document.getElementById('orders-list');
                const loader = document.getElementById('loader');
                const noOrdersMessage = document.getElementById('no-orders-message');
                const orderTemplate = document.getElementById('order-template');
                const restaurantId = document.getElementById('restaurant-id').value;
                const orderStatus = document.getElementById('order-status').value;
                
                // =========================
                // === ORDER HANDLING     ===
                // =========================
                let currentPage = 1;
                let hasMoreOrders = false;
                const pageSize = 10;
                let isLoading = false;
                
                function loadOrders(page = 1, append = false) {
                    if (isLoading) return;
                    isLoading = true;
                    
                    const ordersContainer = document.getElementById('orders-list');
                    const loadingEl = document.getElementById('loading');
                    const noOrdersEl = document.getElementById('no-orders');
                    const loadMoreContainer = document.getElementById('load-more-container');
                    
                    if (!append) {
                        loadingEl.classList.remove('d-none');
                        ordersContainer.classList.add('d-none');
                        noOrdersEl.classList.add('d-none');
                    }
                    
                    // Get default branch id
                    const branchId = 1; // You should get this from the restaurant or session
                    const url = `/api/orders/restaurant/branch/${branchId}/${orderStatus}?page=${page}&size=${pageSize}`;
                    
                    fetch(url)
                        .then(response => {
                            if (!response.ok) throw new Error('Network response was not ok');
                            return response.json();
                        })
                        .then(data => {
                            const orders = data.orders || [];
                            
                            if (page === 1 && orders.length === 0) {
                                loadingEl.classList.add('d-none');
                                noOrdersEl.classList.remove('d-none');
                                return;
                            }
                            
                            if (!append) {
                                ordersContainer.innerHTML = '';
                            }
                            
                            orders.forEach(order => {
                                const orderElement = createOrderElement(order);
                                ordersContainer.appendChild(orderElement);
                            });
                            
                            loadingEl.classList.add('d-none');
                            ordersContainer.classList.remove('d-none');
                            
                            // Check if there are more pages
                            hasMoreOrders = page < data.totalPages;
                            if (hasMoreOrders) {
                                loadMoreContainer.style.display = 'block';
                            } else {
                                loadMoreContainer.style.display = 'none';
                            }
                            
                            currentPage = page;
                            isLoading = false;
                        })
                        .catch(error => {
                            console.error('Error fetching orders:', error);
                            loadingEl.classList.add('d-none');
                            ordersContainer.innerHTML = `
                                <div class="alert alert-danger">
                                    Có lỗi xảy ra khi tải đơn hàng. Vui lòng thử lại sau.
                                </div>
                            `;
                            ordersContainer.classList.remove('d-none');
                            isLoading = false;
                        });
                }
                
                function createOrderElement(order) {
                    const orderDiv = document.createElement('div');
                    orderDiv.className = 'card mb-3 order-card';
                    orderDiv.id = `order-${order.orderId}`;
                    
                    // Format status and get appropriate badge
                    let statusBadge = '';
                    switch (order.status) {
                        case 'PENDING':
                            statusBadge = '<span class="badge bg-warning text-dark">Đang chờ xác nhận</span>';
                            break;
                        case 'CONFIRMED':
                            statusBadge = '<span class="badge bg-info">Đã xác nhận</span>';
                            break;
                        case 'COMPLETED':
                            statusBadge = '<span class="badge bg-success">Hoàn thành</span>';
                            break;
                        case 'CANCELLED':
                            statusBadge = '<span class="badge bg-danger">Đã hủy</span>';
                            break;
                        default:
                            statusBadge = `<span class="badge bg-secondary">${order.status}</span>`;
                    }
                    
                    // Format date
                    const orderDate = new Date(order.orderDate);
                    const formattedDate = orderDate.toLocaleString('vi-VN');
                    
                    orderDiv.innerHTML = `
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-0">Đơn hàng #${order.orderId}</h5>
                                <small class="text-muted">${formattedDate}</small>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6>Thông tin khách hàng</h6>
                                    <p><strong>Tên:</strong> ${order.customerName}</p>
                                    <p><strong>Địa chỉ:</strong> ${order.address}</p>
                                    <p><strong>Số điện thoại:</strong> ${order.phone || 'N/A'}</p>
                                </div>
                                <div class="col-md-6">
                                    <h6>Chi tiết đơn hàng</h6>
                                    <p><strong>Tổng tiền:</strong> ${order.totalAmount.toLocaleString('vi-VN')} đ</p>
                                    <p><strong>Ghi chú:</strong> ${order.note || 'Không có'}</p>
                                </div>
                            </div>
                            
                            <h6 class="mt-3">Danh sách món</h6>
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Món</th>
                                            <th>Số lượng</th>
                                            <th>Đơn giá</th>
                                            <th>Thành tiền</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${order.items.map(item => `
                                            <tr>
                                                <td>${item.productName}</td>
                                                <td>${item.quantity}</td>
                                                <td>${item.unitPrice.toLocaleString('vi-VN')} đ</td>
                                                <td>${(item.unitPrice * item.quantity).toLocaleString('vi-VN')} đ</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        ${order.status === 'PENDING' ? `
                            <div class="card-footer">
                                <div class="d-flex justify-content-end">
                                    <button class="btn btn-outline-danger me-2 cancel-order-btn" data-id="${order.orderId}">
                                        <i class="fas fa-times me-1"></i> Từ chối
                                    </button>
                                    <button class="btn btn-success confirm-order-btn" data-id="${order.orderId}">
                                        <i class="fas fa-check me-1"></i> Xác nhận
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    `;
                    
                    return orderDiv;
                }
                
                // Initial load
                loadOrders();
                
                // Add scroll event listener
                window.addEventListener('scroll', handleScroll);
            });
            
            let stompClient = null;
            const restaurantId = document.getElementById('restaurant-id').value;
            const orderStatus = document.getElementById('order-status').value;

            function connectWebSocket() {
                console.log('Connecting WebSocket for restaurant ID:', restaurantId);
                
                if (!restaurantId) {
                    console.error('Restaurant ID is not defined');
                    return;
                }
                
                const socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);
                stompClient.debug = null; // Tắt debug logs để tránh làm rối console
                
                stompClient.connect({}, function(frame) {
                    console.log('Connected to WebSocket:', frame);
                    
                    const subscription = `/topic/restaurant/${restaurantId}/orders`;
                    console.log('Subscribing to:', subscription);
                    
                    stompClient.subscribe(subscription, function(message) {
                        try {
                            const order = JSON.parse(message.body);
                            console.log('New order received:', order);
                            
                            // Thêm đơn hàng mới vào đầu danh sách
                            if (orderStatus === 'active') {
                                prependOrder(order);
                                
                                // Hiển thị thông báo có đơn hàng mới
                                showNotification('Đơn hàng mới', `Đơn hàng #${order.orderId} từ ${order.customerName}`);
                                
                                // Phát âm thanh thông báo
                                playNotificationSound();
                            }
                        } catch (e) {
                            console.error('Error processing message:', e);
                        }
                    });
                }, function(error) {
                    console.error('WebSocket connection error:', error);
                    setTimeout(connectWebSocket, 5000);
                });
            }

            function showNewOrderNotification(order) {
                // Tạo thông báo có âm thanh
                const audio = new Audio('/audio/new-order.mp3');
                audio.play().catch(e => console.log('Auto-play prevented:', e));
                
                // Tạo thông báo trên màn hình
                const notificationElement = document.createElement('div');
                notificationElement.className = 'toast align-items-center text-white bg-primary border-0';
                notificationElement.setAttribute('role', 'alert');
                notificationElement.setAttribute('aria-live', 'assertive');
                notificationElement.setAttribute('aria-atomic', 'true');
                
                notificationElement.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">
                            <strong>Đơn hàng mới #${order.orderId}</strong><br>
                            Từ: ${order.customerName}<br>
                            Tổng tiền: ${formatCurrency(order.totalAmount)}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Đóng"></button>
                    </div>
                `;
                
                // Thêm vào container
                const toastContainer = document.getElementById('toast-container');
                if (!toastContainer) {
                    const container = document.createElement('div');
                    container.id = 'toast-container';
                    container.className = 'position-fixed top-0 end-0 p-3';
                    container.style.zIndex = '1050';
                    document.body.appendChild(container);
                }
                
                document.getElementById('toast-container').appendChild(notificationElement);
                
                // Hiển thị toast
                const toast = new bootstrap.Toast(notificationElement, {
                    autohide: false
                });
                toast.show();
                
                // Nếu đang ở tab khác, hiển thị badge thông báo
                updateNewOrdersBadge(1);
            }

            function prependNewOrder(order) {
                // Tạo card đơn hàng mới và thêm vào đầu danh sách
                const orderCard = createOrderCard(order);
                ordersList.insertBefore(orderCard, ordersList.firstChild);
            }

            function updateNewOrdersBadge(count) {
                const badge = document.getElementById('new-orders-badge');
                if (badge) {
                    const currentCount = parseInt(badge.textContent || '0');
                    badge.textContent = currentCount + count;
                    badge.classList.remove('d-none');
                } else {
                    // Tạo badge nếu chưa có
                    const tabActive = document.querySelector('.nav-link[href="/restaurant/order/active"]');
                    if (tabActive) {
                        const badge = document.createElement('span');
                        badge.id = 'new-orders-badge';
                        badge.className = 'badge bg-danger ms-2';
                        badge.textContent = count;
                        tabActive.appendChild(badge);
                    }
                }
            }

            // Kết nối WebSocket khi trang được tải
            document.addEventListener('DOMContentLoaded', function() {
                // Các code khác đã có...
                
                // Kết nối WebSocket
                connectWebSocket();
            });
        </script>
    </div>
</body>
</html>
