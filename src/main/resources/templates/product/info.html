<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/base}">

<head>
    <title>Chi tiết món ăn</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/product/info.css}">
    </th:block>
    <style>
        .product-categories .badge {
            font-size: 1em;
            margin-right: 0.5em;
            margin-bottom: 0.3em;
        }
        .feedback-section {
            margin-top: 2rem;
        }
        .feedback-list {
            margin-top: 1rem;
        }
        .feedback-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .feedback-rating {
            color: #ffc107;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }
        .feedback-content {
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <main class="container mt-4">
        <div class="row">
            <!-- Chi tiết sản phẩm -->
            <div class="col-lg-8">
                <div class="product-details card shadow-sm">
                    <div class="card-header product-header">
                        <h2 class="product-title" id="productName" th:text="${product.name}">Tên sản phẩm</h2>
                        <div class="product-price">
                            <span class="price-value" id="productPrice" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' VND'">0 VND</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="product-image-container mb-4">
                            <img id="productImage"
                                 th:src="${product.imageUrl != null} ? ${product.imageUrl} : '/images/Food/bunmangga.png'"
                                 alt="Hình ảnh món ăn"
                                 class="product-image img-fluid rounded">
                        </div>
                        <div class="product-info">
                            <h5 class="section-title">Mô tả sản phẩm</h5>
                            <p class="product-description" id="productDescription" th:text="${product.description}">Mô tả sản phẩm</p>
                            <h5 class="section-title mt-4">Danh mục</h5>
                            <div class="product-categories">
                                <span th:if="${#lists.isEmpty(product.categories)}">Không có danh mục</span>
                                <span th:each="cat : ${product.categories}" class="badge bg-primary me-1" th:text="${cat}">Danh mục</span>
                            </div>
                            <h5 class="section-title mt-4">Địa chỉ quán</h5>
                            <p class="product-restaurant-address" id="restaurantAddress" th:text="${product.restaurantName}">Địa chỉ quán</p>
                            <h5 class="section-title mt-4">Đánh giá</h5>
                            <div class="product-rating">
                                <div class="stars" id="productStars">
                                    <!-- Stars will be rendered by JS -->
                                </div>
                                <span class="rating-value" id="productRating" th:text="'(' + (${product.rating} ?: 0) + '/5)'">(0/5)</span>
                            </div>
                            <h5 class="section-title mt-4">Số lượng còn lại</h5>
                            <div id="remainingQuantity" th:text="${product.remainingQuantity}">0</div>
                            <!-- Đặt hàng button -->
                            <div class="mt-4 d-flex justify-content-end">
                                <script th:inline="javascript">
                                    let product = {
                                        id: [[${product.productId}]],
                                        name: [[${product.name}]],
                                        price: [[${product.price}]],
                                        imageUrl: [[${product.imageUrl}]],
                                        restaurantName: [[${product.restaurantName}]]
                                    };
                                </script>

                                <button class="btn btn-primary btn-add-cart" onclick="addToCart(product.id, product.name, product.price, product.imageUrl, product.restaurantName)">
                                    <i class="fas fa-shopping-cart"></i> Đặt hàng
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Feedback Section -->
                <div class="feedback-section">
                    <h5 class="section-title">Phản hồi của khách hàng</h5>
                    <div id="feedbackList" class="feedback-list">
                        <div>Đang tải phản hồi...</div>
                    </div>
                </div>
            </div>
            <!-- Thông tin giao hàng và đặt hàng đã bị xóa -->
        </div>
    </main>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Lấy productId từ Thymeleaf
            const productId = /*[[${product.productId}]]*/ 0;
            if (!productId) return;

            // Fetch feedbacks and render
            fetch(`http://157.245.52.20:9357/api/feedbacks/list/${productId}`)
                .then(res => res.json())
                .then(feedbacks => {
                    const feedbackList = document.getElementById('feedbackList');
                    if (!feedbacks || feedbacks.length === 0) {
                        feedbackList.innerHTML = '<div>Chưa có phản hồi nào.</div>';
                        return;
                    }
                    feedbackList.innerHTML = feedbacks.map(fb => `
                        <div class="feedback-item">
                            <div class="feedback-rating">
                                ${'<i class="fas fa-star"></i>'.repeat(fb.rating)}
                                ${'<i class="far fa-star"></i>'.repeat(5 - fb.rating)}
                                <span class="ms-2 text-muted">(${fb.rating}/5)</span>
                            </div>
                            <div class="feedback-content">${fb.content}</div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('feedbackList').innerHTML = '<div>Không thể tải phản hồi.</div>';
                });
        });
    </script>
</div>
</body>
</html>
