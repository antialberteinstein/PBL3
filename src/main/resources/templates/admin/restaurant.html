<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin_layout}">
<head>
    <title>Quản lý nhà hàng - ShoppieFood Admin</title>
    <style>
        .restaurant-status-badge {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .restaurant-action-btn { min-width: 90px; }
        .restaurant-bg-img {
            width: 60px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--matrix-green);
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="glitch" data-text="QUẢN LÝ NHÀ HÀNG" style="color: var(--matrix-green);">QUẢN LÝ NHÀ HÀNG</h2>
        </div>
    </div>
    <div class="dashboard-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <i class="fas fa-store card-icon"></i>
                <span class="card-title">Danh sách nhà hàng</span>
            </div>
            <div>
                <input type="text" id="restaurantSearchInput" class="form-control" placeholder="Tìm kiếm theo tên, chủ nhà hàng..." style="width: 300px;">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ảnh nền</th>
                        <th>Tên nhà hàng</th>
                        <th>Mô tả</th>
                        <th>Chủ nhà hàng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="restaurantTableBody">
                    <!-- Restaurants will be loaded here -->
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination justify-content-center" id="restaurantPagination"></ul>
        </nav>
    </div>
</div>

<th:block layout:fragment="script">
<script>
const restaurantTableBody = document.getElementById('restaurantTableBody');
const restaurantPagination = document.getElementById('restaurantPagination');
const restaurantSearchInput = document.getElementById('restaurantSearchInput');
let restaurantPage = 0;
let restaurantSize = 10;
let restaurantSearch = '';

function loadRestaurants(page = 0, search = '') {
    restaurantPage = page;
    restaurantSearch = search;
    let url = `/api/admin/restaurants?page=${page}&size=${restaurantSize}`;
    fetch(url)
        .then(res => res.json())
        .then(data => {
            let restaurants = data.restaurants || [];
            restaurantTableBody.innerHTML = '';
            let filtered = restaurants;
            if (search) {
                const s = search.toLowerCase();
                filtered = restaurants.filter(r =>
                    (r.restaurantName && r.restaurantName.toLowerCase().includes(s)) ||
                    (r.sellerName && r.sellerName.toLowerCase().includes(s))
                );
            }
            filtered.forEach((restaurant, idx) => {
                restaurantTableBody.innerHTML += `
                    <tr>
                        <td>${(data.currentPage * restaurantSize) + idx + 1}</td>
                        <td>
                            <img src="${restaurant.backgroundUrl || '/images/no-image.png'}" class="restaurant-bg-img" alt="">
                        </td>
                        <td>${restaurant.restaurantName || ''}</td>
                        <td>${restaurant.description || ''}</td>
                        <td>
                            <div>${restaurant.sellerName || ''}</div>
                            <div class="text-muted small">#${restaurant.sellerId || ''}</div>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-info restaurant-action-btn" onclick="viewRestaurant(${restaurant.restaurantId})">
                                <i class="fas fa-eye"></i> Xem
                            </button>
                        </td>
                    </tr>
                `;
            });
            // Pagination
            restaurantPagination.innerHTML = '';
            for (let i = 0; i < (data.totalPages || 1); i++) {
                restaurantPagination.innerHTML += `
                    <li class="page-item ${i === data.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadRestaurants(${i}, restaurantSearchInput.value);return false;">${i + 1}</a>
                    </li>
                `;
            }
        });
}

function viewRestaurant(restaurantId) {
    showNotification('Xem chi tiết nhà hàng #' + restaurantId, 'info');
    // TODO: Hiển thị modal chi tiết nhà hàng nếu muốn
}

restaurantSearchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        loadRestaurants(0, restaurantSearchInput.value);
    }
});
restaurantSearchInput.addEventListener('input', function() {
    if (!this.value) loadRestaurants(0, '');
});

document.addEventListener('DOMContentLoaded', function() {
    loadRestaurants();
});
</script>
</th:block>
</body>
</html>
