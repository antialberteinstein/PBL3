<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin_layout}">
<head>
    <title>Đăng nhập - Admin</title>
    <style>
        .login-card {
            max-width: 400px;
            margin: 80px auto 0 auto;
            background: linear-gradient(135deg, var(--matrix-card-bg), #1a2332);
            border: 1.5px solid var(--matrix-green);
            border-radius: 18px;
            box-shadow: 0 0 24px #00ff4160;
            padding: 2.5rem 2rem 2rem 2rem;
            color: var(--matrix-text);
        }
        .login-title {
            color: var(--matrix-green);
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        .form-label {
            color: var(--matrix-green);
            font-weight: 600;
        }
        .matrix-btn {
            width: 100%;
            margin-top: 1rem;
        }
        .login-error {
            color: #ff0040;
            font-weight: bold;
            text-align: center;
            margin-top: 1rem;
            letter-spacing: 1px;
        }
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch::before {
            animation: glitch-anim-1 0.3s infinite linear alternate-reverse;
            color: #ff0040; z-index: -1;
        }
        .glitch::after {
            animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
            color: #00ffff; z-index: -2;
        }
        @keyframes glitch-anim-1 {
            0% { clip: rect(2px, 9999px, 8px, 0); }
            100% { clip: rect(12px, 9999px, 22px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(8px, 9999px, 14px, 0); }
            100% { clip: rect(18px, 9999px, 28px, 0); }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="login-card">
        <div class="login-title glitch" data-text="ADMIN LOGIN">ADMIN LOGIN</div>
        <form action="/admin/login" method="post" autocomplete="off">
            <div class="mb-3">
                <label for="loginName" class="form-label">Tên đăng nhập</label>
                <input type="text" id="loginName" name="loginName" class="form-control" placeholder="Tên đăng nhập" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn matrix-btn">Đăng nhập</button>
            <div th:if="${error}" class="login-error" th:text="${error}"></div>
        </form>
    </div>
</div>
</body>
</html>
