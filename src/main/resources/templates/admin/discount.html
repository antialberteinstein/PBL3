<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin_layout}">
<head>
    <title>Quản lý mã giảm giá - ShoppieFood Admin</title>
    <style>
        .discount-type-badge { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; background: #222; border-radius: 8px; padding: 2px 10px; }
        .discount-type-percentage { color: #00ffff; border: 1px solid #00ffff; }
        .discount-type-fixed { color: #ffb300; border: 1px solid #ffb300; }
        .discount-type-freeship { color: #00ff90; border: 1px solid #00ff90; }
        .discount-type-price { color: var(--matrix-green); border: 1px solid var(--matrix-green); }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="glitch" data-text="QUẢN LÝ MÃ GIẢM GIÁ" style="color: var(--matrix-green);">QUẢN LÝ MÃ GIẢM GIÁ</h2>
        </div>
    </div>
    <div class="dashboard-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <i class="fas fa-ticket-alt card-icon"></i>
                <span class="card-title">Danh sách mã giảm giá</span>
            </div>
            <div>
                <button class="matrix-btn" onclick="window.location.href='http://157.245.52.20:23581/api/discounts/create'">
                    <i class="fas fa-plus"></i> Tạo mã giảm giá
                </button>
            </div>
        </div>
        <ul class="nav nav-tabs mb-3" id="discountTabs">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-type="all">Tất cả</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-type="priceDecrease">Giảm giá trực tiếp</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-type="freeship">Freeship</a>
            </li>
        </ul>
        <div class="mb-3">
            <input type="text" id="discountSearchInput" class="form-control" placeholder="Tìm kiếm theo mã, tên..." style="width: 300px;">
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã</th>
                        <th>Loại</th>
                        <th>Kiểu</th>
                        <th>Giá trị</th>
                        <th>Ngày bắt đầu</th>
                        <th>Ngày kết thúc</th>
                        <th>Lượt dùng</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="discountTableBody">
                    <!-- Discounts will be loaded here -->
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination justify-content-center" id="discountPagination"></ul>
        </nav>
    </div>
</div>

<th:block layout:fragment="script">
<script>
const discountTableBody = document.getElementById('discountTableBody');
const discountPagination = document.getElementById('discountPagination');
const discountSearchInput = document.getElementById('discountSearchInput');
const discountTabs = document.getElementById('discountTabs');
let discountPage = 0;
let discountSize = 10;
let discountSearch = '';
let discountType = 'all';

const apiMap = {
    all: "http://157.245.52.20:23581/api/discounts/all",
    priceDecrease: "http://157.245.52.20:23581/api/discounts/priceDecrease",
    freeship: "http://157.245.52.20:23581/api/discounts/freeship"
};

function getTypeBadge(type) {
    if (type === 'freeship') return '<span class="discount-type-badge discount-type-freeship">Freeship</span>';
    if (type === 'priceDecrease') return '<span class="discount-type-badge discount-type-price">Giảm giá</span>';
    return `<span class="discount-type-badge">${type}</span>`;
}
function getStatusBadge(start, end) {
    const now = new Date();
    const startDate = new Date(start);
    const endDate = new Date(end);
    if (now < startDate) return '<span class="discount-status-expired">Chưa bắt đầu</span>';
    if (now > endDate) return '<span class="discount-status-expired">Hết hạn</span>';
    return '<span class="discount-status-active">Đang hoạt động</span>';
}

function loadDiscounts(page = 0, search = '') {
    discountPage = page;
    discountSearch = search;
    let url = apiMap[discountType] + `?page=${page}&size=${discountSize}`;
    fetch(url)
        .then(res => res.json())
        .then(data => {
            let discounts = data.discounts || data.content || [];
            // Support both "discounts" and "content" as list key
            if (!Array.isArray(discounts)) discounts = [];
            discountTableBody.innerHTML = '';
            let filtered = discounts;
            if (search) {
                const s = search.toLowerCase();
                filtered = discounts.filter(d =>
                    (d.code && d.code.toLowerCase().includes(s)) ||
                    (d.name && d.name.toLowerCase().includes(s))
                );
            }
            filtered.forEach((discount, idx) => {
                // Type badge
                let typeBadge = discount.type === 'percentage'
                    ? '<span class="discount-type-badge discount-type-percentage">%</span>'
                    : '<span class="discount-type-badge discount-type-fixed">Tiền</span>';

                // Kind badge
                let kindBadge = discount.kind === 'free_shipping'
                    ? '<span class="discount-type-badge discount-type-freeship">Freeship</span>'
                    : '<span class="discount-type-badge discount-type-price">Giảm giá</span>';

                // Value display
                let valueDisplay = discount.type === 'percentage'
                    ? (discount.value ? discount.value + '%' : '')
                    : (discount.value ? discount.value.toLocaleString('vi-VN') + ' VNĐ' : '');

                // Date formatting
                function formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('vi-VN');
                }

                discountTableBody.innerHTML += `
                    <tr>
                        <td>${(data.currentPage || data.pageable?.pageNumber || 0) * discountSize + idx + 1}</td>
                        <td>${discount.code || ''}</td>
                        <td>${typeBadge}</td>
                        <td>${kindBadge}</td>
                        <td>${valueDisplay}</td>
                        <td>${formatDate(discount.startDate)}</td>
                        <td>${formatDate(discount.endDate)}</td>
                        <td>${discount.userCount === -1 ? '∞' : (discount.userCount ?? 0)}</td>
                        <td>${getStatusBadge(discount.startDate, discount.endDate)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info discount-action-btn" onclick="viewDiscount('${discount.code}')">
                                <i class="fas fa-eye"></i> Xem
                            </button>
                        </td>
                    </tr>
                `;
            });
            // Pagination
            let totalPages = data.totalPages || data.pageable?.totalPages || 1;
            let currentPage = data.currentPage ?? data.pageable?.pageNumber ?? 0;
            discountPagination.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                discountPagination.innerHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadDiscounts(${i}, discountSearchInput.value);return false;">${i + 1}</a>
                    </li>
                `;
            }
        });
}

function viewDiscount(code) {
    showNotification('Xem chi tiết mã: ' + code, 'info');
    // TODO: Hiển thị modal chi tiết mã giảm giá nếu muốn
}

// Tab switching
discountTabs.querySelectorAll('.nav-link').forEach(tab => {
    tab.addEventListener('click', function(e) {
        e.preventDefault();
        discountTabs.querySelectorAll('.nav-link').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        discountType = this.getAttribute('data-type');
        loadDiscounts(0, discountSearchInput.value);
    });
});

// Search
discountSearchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        loadDiscounts(0, discountSearchInput.value);
    }
});
discountSearchInput.addEventListener('input', function() {
    if (!this.value) loadDiscounts(0, '');
});

document.addEventListener('DOMContentLoaded', function() {
    loadDiscounts();
});
</script>
</th:block>
</body>
</html>
