<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/base}">
<head>
    <title>401 - Không có quyền truy cập</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container text-center" style="padding: 60px 0;">
            <h1 style="font-size: 6rem; color: #ff6f61; font-weight: bold;">401</h1>
            <h2 style="margin-bottom: 20px;">Không có quyền truy cập</h2>
            <p class="mb-4">Bạn không có quyền truy cập vào trang này. Vui lòng đăng nhập hoặc liên hệ quản trị viên nếu bạn nghĩ đây là lỗi.</p>
            <p th:text="${message}" class="mb-4"></p>
            <a href="/auth/login" class="btn btn-primary" style="padding: 10px 30px; font-size: 1.2rem;">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </a>
            <a href="/" class="btn btn-secondary ms-2" style="padding: 10px 30px; font-size: 1.2rem;">
                <i class="fas fa-home"></i> Về trang chủ
            </a>
        </div>
    </div>
</body>
</html>
