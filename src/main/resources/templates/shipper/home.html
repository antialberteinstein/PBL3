<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/base}">
<head>
    <title>Hồ Sơ Shipper</title>
    <link rel="stylesheet" th:href="@{/css/shipper/profile.css}">
    <link rel="stylesheet" th:href="@{/css/shipper/shipper.css}">
    <style>
        .shipper-main-content {
            width: 100vw;
            max-width: 100vw;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .profile-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
            margin: 0 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 2px solid #f5f5f5;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-info {
            text-align: center;
        }
        .profile-info h1 {
            margin: 0 0 8px 0;
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }
        .shipper-id {
            color: #7f8c8d;
            font-size: 1.1rem;
            font-weight: 500;
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }
        .info-section {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            text-align: left;
        }
        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 0 24px 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .section-title i {
            color: #3498db;
            font-size: 1.3rem;
        }
        .info-grid {
            display: grid;
            gap: 20px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .info-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .info-label {
            color: #6c757d;
            font-weight: 600;
            flex-shrink: 0;
            font-size: 0.95rem;
        }
        .info-value {
            text-align: right;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1rem;
        }
        .actions {
            margin-top: 40px;
            text-align: center;
            padding-top: 32px;
            border-top: 1px solid #e9ecef;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 2px solid;
            cursor: pointer;
        }
        .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
            background: transparent;
        }
        .btn-outline-danger:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(220, 53, 69, 0.4);
        }
        @media (max-width: 768px) {
            .content-wrapper, .main-content, [layout\:fragment="content"] {
                padding-top: 20px;
            }
            .profile-container {
                margin: 0 15px;
                padding: 24px;
            }
            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 3rem;
            }
            .profile-info h1 {
                font-size: 1.8rem;
            }
            .shipper-id {
                font-size: 1rem;
            }
            .info-section {
                padding: 24px;
            }
            .info-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 16px;
            }
            .info-value {
                text-align: left;
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }
            .profile-info h1 {
                font-size: 1.6rem;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .info-section {
                padding: 20px;
            }
            .btn {
                padding: 14px 24px;
                font-size: 0.9rem;
            }
        }
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .profile-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c);
            border-radius: 22px;
            z-index: -1;
            opacity: 0.1;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
<div class="shipper-main-content">
    <div class="profile-container fade-in">
        <!-- Header Section -->
        <header class="header">
            <div class="profile-avatar">
                <span th:text="${shipper?.user?.avatarUrl != null && !#strings.isEmpty(shipper?.user?.avatarUrl) ? '' : '👤'}"></span>
                <img th:if="${shipper?.user?.avatarUrl != null && !#strings.isEmpty(shipper?.user?.avatarUrl)}"
                     th:src="@{${shipper?.user?.avatarUrl}}"
                     th:alt="${shipper?.user?.name ?: 'avatar'}"
                     loading="lazy">
            </div>
            <div class="profile-info">
                <h1 th:text="${shipper?.user?.name ?: 'Chưa cập nhật'}">PHAN MINH HIẾU</h1>
                <p class="shipper-id" th:text="'ID: #SH' + (${shipper?.shipperId ?: 'xxxxx'})">ID: #SHxxxxx</p>
            </div>
        </header>

        <!-- Info Section -->
        <section class="info-section fade-in">
            <h2 class="section-title">
                <i class="fas fa-user-circle" aria-hidden="true"></i>
                Thông Tin Cá Nhân
            </h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Số điện thoại:</span>
                    <span class="info-value" th:text="${shipper?.user?.phoneNumber ?: 'Chưa cập nhật'}">0123456789</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Email:</span>
                    <span class="info-value" th:text="${shipper?.user?.email ?: 'Chưa cập nhật'}">hieuphan@gmail.com</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Phương tiện:</span>
                    <span class="info-value"
                        th:text="|${shipper.vehicleType == 'motocycle' ? 'Xe máy' 
                                        : shipper.vehicleType == 'car' ? 'Ô tô' 
                                        : shipper.vehicleType == 'truck' ? 'Xe tải' 
                                        : shipper.vehicleType != null ? shipper.vehicleType : 'Chưa cập nhật'} - ${shipper.plateNumber != null ? shipper.plateNumber : ''}|">
                        Xe máy - 29A1-12345
                    </span>

                </div>
                <div class="info-item">
                    <span class="info-label">Bằng lái:</span>
                    <span class="info-value" th:text="${shipper?.driverLicense ?: 'Chưa cập nhật'}">123456789</span>
                </div>
            </div>
        </section>

        <!-- Actions -->
        <div class="actions fade-in">
            <a class="btn btn-outline-danger" th:href="@{/shipper/exit}" role="button">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                Thoát chế độ shipper
            </a>
        </div>
    </div>
</div>
</div>

<th:block layout:fragment="script">
<script>
    // Enhanced fade-in animation observer
    const observeElements = () => {
        const elements = document.querySelectorAll('.fade-in');
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, index * 150);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.2 });
            elements.forEach(el => observer.observe(el));
        } else {
            elements.forEach(el => el.classList.add('visible'));
        }
    };

    // Initialize on DOM ready
    const init = () => {
        observeElements();
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        setTimeout(init, 100);
    }
</script>
</th:block>
</body>
</html>
