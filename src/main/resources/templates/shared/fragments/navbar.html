<div th:fragment="navbar">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <!-- Sidebar Toggle Button (only if logged in) -->
            <div th:if="${session.role != null}">
                <button id="sidebarToggleBtn" class="menu-toggle me-2" type="button" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <!-- Brand -->
            <a class="navbar-brand" href="/">Shoppie Food</a>
            
            <!-- Navbar Toggle Button for mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Navbar Items -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Trang chủ</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 'user'}">
                        <a class="nav-link" href="/user/order">Đơn hàng</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 'restaurant'}">
                        <a class="nav-link" href="/restaurant/order">Đơn hàng mới</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 'shipper'}">
                        <a class="nav-link" href="/shipper/order">Đơn giao hàng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">Về chúng tôi</a>
                    </li>
                </ul>
                
                <!-- Right side items -->
                <ul class="navbar-nav">
                    <!-- Cart fragment for logged-in users -->
                    <li class="nav-item" th:if="${session.role == 'user'}">
                        <div class="nav-link" style="cursor: pointer;">
                            <div th:replace="~{shared/fragments/cart :: cart}"></div>
                        </div>
                    </li>
                    <!-- Show login/register if not logged in -->
                    <li class="nav-item" th:if="${session.userName == null}">
                        <a class="nav-link" href="/auth/login">Đăng nhập</a>
                    </li>
                    <li class="nav-item" th:if="${session.userName == null}">
                        <a class="nav-link" href="/auth/register">Đăng ký</a>
                    </li>
                    <!-- Show user profile if logged in -->
                    <li class="nav-item" th:if="${session.userName != null && session.role == 'user'}">
                        <a class="nav-link" href="/user/profile">
                            <i class="fas fa-user"></i> 
                            <span th:text="${session.userName}">Tên người dùng</span>
                        </a>
                    </li>
                    <!-- Logout link for logged in users -->
                    <li class="nav-item" th:if="${session.userName != null && session.role == 'user'}">
                        <a class="nav-link" href="/auth/logout">Đăng xuất</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 'restaurant'}">
                        <a class="nav-link" href="/restaurant/exit">Thoát</a>
                    </li>
                    <li class="nav-item" th:if="${session.role == 'shipper'}">
                        <a class="nav-link" href="/shipper/exit">Thoát</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
