<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="address-popup">
        <!-- Modal overlay for address selection -->
        <div id="addressPopup" class="modal-overlay">
            <div class="address-popup">
                <div class="popup-header">
                    <h3>Chọn địa chỉ giao hàng</h3>
                    <button id="addressClose" class="popup-close-btn" type="button">&times;</button>
                </div>
                <div class="popup-body">
                    <!-- Address list -->
                    <div class="saved-addresses" id="savedAddresses"></div>
                    <!-- Add new address button -->
                    <div class="add-new-address">
                        <button type="button" class="btn-add-address" id="btnAddAddress">
                            <i class="fas fa-plus-circle"></i> Thêm địa chỉ mới
                        </button>
                    </div>
                    <!-- Order note -->
                    <div class="form-group">
                        <label for="note">Ghi chú đơn hàng (tùy chọn)</label>
                        <textarea id="note" class="form-control" rows="2" placeholder="Ghi chú cho người giao hàng"></textarea>
                    </div>
                </div>
                <div class="address-action-buttons">
                    <button type="button" class="btn-secondary" id="cancelAddress">Hủy</button>
                    <button type="button" class="btn-primary" id="confirmAddress">Xác nhận đặt hàng</button>
                </div>
            </div>
        </div>

        <!-- Modal for Add/Update Address -->
        <div class="modal fade" id="addressEditModal" tabindex="-1" aria-labelledby="addressEditModalLabel" aria-hidden="true" style="z-index: 1333;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="addressEditForm">
                        <input type="hidden" id="editAddressId">
                        <div class="modal-header">
                            <h5 class="modal-title" id="addressEditModalLabel">Thêm địa chỉ mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="editAddressName" class="form-label">Tên địa chỉ</label>
                                <input type="text" class="form-control" id="editAddressName" placeholder="Nhà riêng, Văn phòng,...">
                            </div>
                            <div class="mb-3">
                                <label for="editPhoneNumber" class="form-label">Số điện thoại</label>
                                <input type="text" class="form-control" id="editPhoneNumber"/>
                            </div>
                            <div class="mb-3">
                                <label for="editAddressLine1" class="form-label">Địa chỉ 1 (Số nhà, tên đường)</label>
                                <input type="text" class="form-control" id="editAddressLine1">
                            </div>
                            <div class="mb-3">
                                <label for="editAddressLine2" class="form-label">Địa chỉ 2 (Tòa nhà, lầu)</label>
                                <input type="text" class="form-control" id="editAddressLine2">
                            </div>
                            <div class="mb-3">
                                <label for="editWard" class="form-label">Phường/Xã</label>
                                <input type="text" class="form-control" id="editWard" required>
                            </div>
                            <div class="mb-3">
                                <label for="editCity" class="form-label">Tỉnh/Thành phố</label>
                                <input type="text" class="form-control" id="editCity" required>
                            </div>
                            <div class="mb-3">
                                <label for="editNote" class="form-label">Ghi chú</label>
                                <textarea class="form-control" id="editNote" rows="2"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">Lưu địa chỉ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
