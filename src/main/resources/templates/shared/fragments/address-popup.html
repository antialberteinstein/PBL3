<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="address-form">
        <!-- Modal thêm địa chỉ mới -->
        <div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addAddressModalLabel">Thêm địa chỉ mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="address-form">
                            <div class="mb-3">
                                <label for="receiver-name" class="form-label">Tên người nhận</label>
                                <input type="text" class="form-control" id="receiver-name" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="phone" required pattern="[0-9]{10}">
                                <div class="form-text">Nhập số điện thoại 10 chữ số</div>
                            </div>
                            <div class="mb-3">
                                <label for="address-detail" class="form-label">Địa chỉ chi tiết</label>
                                <textarea class="form-control" id="address-detail" rows="2" required></textarea>
                                <div class="form-text">Nhập số nhà, tên đường, phường/xã...</div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="save-address-btn">Lưu địa chỉ</button>
                    </div>
                </div>
            </div>
        </div>
        
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Thêm sự kiện cho nút thêm địa chỉ mới
                const addAddressBtn = document.getElementById('add-address-btn');
                if (addAddressBtn) {
                    addAddressBtn.addEventListener('click', function() {
                        const addAddressModal = new bootstrap.Modal(document.getElementById('addAddressModal'));
                        addAddressModal.show();
                    });
                }
                
                // Thêm sự kiện cho nút lưu địa chỉ
                const saveAddressBtn = document.getElementById('save-address-btn');
                if (saveAddressBtn) {
                    saveAddressBtn.addEventListener('click', function() {
                        const form = document.getElementById('address-form');
                        if (form.checkValidity()) {
                            // Lấy dữ liệu từ form
                            const receiverName = document.getElementById('receiver-name').value;
                            const phone = document.getElementById('phone').value;
                            const addressDetail = document.getElementById('address-detail').value;
                            
                            // Gửi request để lưu địa chỉ mới
                            fetch('/api/user/address/add', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    receiverName: receiverName,
                                    phone: phone,
                                    fullAddress: addressDetail
                                })
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.success) {
                                    // Đóng modal và tải lại danh sách địa chỉ
                                    const addAddressModal = bootstrap.Modal.getInstance(document.getElementById('addAddressModal'));
                                    addAddressModal.hide();
                                    loadUserAddresses(); // Đã định nghĩa ở trên
                                    
                                    // Reset form
                                    form.reset();
                                } else {
                                    alert('Lỗi: ' + data.message);
                                }
                            })
                            .catch(error => {
                                console.error('Error adding address:', error);
                                alert('Có lỗi xảy ra khi thêm địa chỉ. Vui lòng thử lại sau.');
                            });
                        } else {
                            // Kích hoạt validation của form
                            form.reportValidity();
                        }
                    });
                }
            });
        </script>
    </div>
</body>
</html>
