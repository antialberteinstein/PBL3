<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shoppie Food</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/base/color.css}">
        <link rel="stylesheet" th:href="@{/css/components/navbar.css}">
        <link rel="stylesheet" th:href="@{/css/components/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/components/cart.css}">
        <link rel="stylesheet" th:href="@{/css/components/products.css}">
        <link rel="stylesheet" th:href="@{/css/objects/auth.css}">
        <link rel="stylesheet" th:href="@{/css/objects/food.css}">
        <link rel="stylesheet" th:href="@{/css/objects/order.css}">
        <link rel="stylesheet" th:href="@{/css/objects/user.css}">
        <link rel="stylesheet" th:href="@{/css/misc.css}">
        <th:block layout:fragment="css"></th:block>
    </head>
    <body>
        <!-- Floating Sidebar -->
        <div id="floatingSidebar" class="floating-sidebar">
            <button id="sidebarCloseBtn" class="sidebar-close-btn">
                <img src="/images/icons/sidebar.png" alt="Sidebar" style="width: 32px; height: 32px; border: none !important; background: transparent !important;">
            </button>
            <div th:replace="~{shared/fragments/sidebar :: sidebar}"></div>            
        </div>
        
        <!-- Overlay for mobile -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        
        <div class="content-wrapper">
            <div th:replace="~{shared/fragments/navbar :: navbar}"></div>
            <div class="main-content">
                <div layout:fragment="content"></div>
            </div>
        </div>

        <!-- Nhúng address-popup fragment -->
        <div th:replace="~{shared/fragments/address-popup :: address-popup}"></div>

        <!-- Script -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                console.log("DOM fully loaded - initializing components");
                
                // Sidebar functionality
                const floatingSidebar = document.getElementById('floatingSidebar');
                const sidebarOverlay = document.getElementById('sidebarOverlay');
                const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
                const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
                
                // Thiết lập sự kiện cho nút mở sidebar
                if (sidebarToggleBtn) {
                    sidebarToggleBtn.addEventListener('click', function(event) {
                        event.preventDefault();
                        floatingSidebar.classList.add('active');
                        sidebarOverlay.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    });
                }
                
                // Sự kiện đóng sidebar
                if (sidebarCloseBtn) {
                    sidebarCloseBtn.addEventListener('click', function() {
                        floatingSidebar.classList.remove('active');
                        sidebarOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }
                
                // Đóng sidebar khi nhấp vào overlay
                if (sidebarOverlay) {
                    sidebarOverlay.addEventListener('click', function() {
                        floatingSidebar.classList.remove('active');
                        sidebarOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }
                
                // Cart functionality
                const cartToggle = document.getElementById('cartToggle');
                const cartPopup = document.getElementById('cartPopup');
                const cartClose = document.getElementById('cartClose');
                const hideCartBtn = document.getElementById('hideCart');
                const cartOverlay = document.getElementById('cartOverlay');

                if (cartToggle && cartPopup) {
                    cartToggle.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        cartPopup.classList.add('active');
                        cartOverlay.classList.add('active');
                        document.body.style.overflow = 'hidden'; // Prevent scrolling
                    });
                }

                if (cartClose) {
                    cartClose.addEventListener('click', function() {
                        cartPopup.classList.remove('active');
                        cartOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }

                if (hideCartBtn) {
                    hideCartBtn.addEventListener('click', function() {
                        cartPopup.classList.remove('active');
                        cartOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }

                if (cartOverlay) {
                    cartOverlay.addEventListener('click', function() {
                        cartPopup.classList.remove('active');
                        cartOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }
                
                // Close popup when clicking outside
                document.addEventListener('click', function(e) {
                    if (cartPopup && cartPopup.classList.contains('active') && 
                        !cartPopup.contains(e.target) && 
                        !cartToggle.contains(e.target)) {
                        cartPopup.classList.remove('active');
                    }
                });

                

                // Prevent popup from closing when clicking inside
                if (cartPopup) {
                    cartPopup.addEventListener('click', function(e) {
                        e.stopPropagation();
                    });
                }

                // Xử lý nút đặt hàng
                const checkoutBtn = document.getElementById('checkoutBtn');
                const addressPopup = document.getElementById('addressPopup');
                const addressClose = document.getElementById('addressClose');
                const cancelAddress = document.getElementById('cancelAddress');
                

                

                if (checkoutBtn && addressPopup) {
                    checkoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        // Đóng cart popup
                        if (cartPopup) cartPopup.classList.remove('active');
                        if (cartOverlay) cartOverlay.classList.remove('active');
                        // Mở address popup
                        addressPopup.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        fetchAddresses(); // <-- GỌI NGAY Ở ĐÂY
                        return false;
                    });
                }
                
                // Xử lý đóng popup địa chỉ
                if (addressClose) {
                    addressClose.addEventListener('click', function() {
                        addressPopup.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }
                
                if (cancelAddress) {
                    cancelAddress.addEventListener('click', function() {
                        addressPopup.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }

                // Click bên ngoài để đóng popup (tùy chọn)
                addressPopup.addEventListener('click', function(e) {
                    if (e.target === addressPopup) {
                        addressPopup.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                });
                
                // Xử lý đóng popup bằng nút X
                const closePopupX = document.querySelector('.popup-header .popup-close-btn');
                if (closePopupX) {
                    closePopupX.addEventListener('click', function() {
                        addressPopup.classList.remove('active');
                        document.body.style.overflow = '';
                    });
                }
                
                // Xử lý xác nhận đặt hàng
                const confirmAddress = document.getElementById('confirmAddress');
                if (confirmAddress) {
                    confirmAddress.addEventListener('click', function() {
                        // Lấy địa chỉ được chọn
                        const selectedAddress = document.querySelector('input[name="selectedAddress"]:checked');
                        const note = document.getElementById('note').value;
                        
                        if (selectedAddress) {
                            const addressId = selectedAddress.value;
                            const addressInfo = document.querySelector(`#address${addressId}`).closest('.address-item').querySelector('.address-text').textContent;
                            
                            console.log('Thông tin đặt hàng:', {
                                addressId,
                                addressInfo,
                                note,
                                cartItems,
                                totalAmount
                            });
                            
                            // Hiển thị thông báo đặt hàng thành công
                            showToast('Đặt hàng thành công! Cảm ơn bạn đã mua hàng.');
                            
                            // Đóng popup
                            addressPopup.classList.remove('active');
                            document.body.style.overflow = '';
                            
                            // Đóng giỏ hàng
                            if (cartPopup) {
                                cartPopup.classList.remove('active');
                            }
                            
                            // Xóa giỏ hàng
                            clearCart();
                        } else {
                            showToast('Vui lòng chọn địa chỉ giao hàng', 'error');
                        }
                    });
                }

                updateCartUI();
            });

            // Hàm render danh sách địa chỉ
            function renderAddresses(addresses) {
                console.log("Rendered addresses:", addresses);
                const container = document.getElementById('savedAddresses');
                if (!container) return;
                if (!addresses || addresses.length === 0) {
                    container.innerHTML = `<div class="text-muted px-2 py-2">Bạn chưa có địa chỉ nào.</div>`;
                    return;
                }
                container.innerHTML = addresses.map((addr, idx) => `
                    <div class="address-item${addr.default ? ' selected' : ''}">
                        <div class="address-radio">
                            <input type="radio" name="selectedAddress" id="address${addr.userAddressId}" value="${addr.userAddressId}" ${addr.default ? 'checked' : ''}>
                            <label for="address${addr.userAddressId}"></label>
                        </div>
                        <div class="address-content">
                            <div class="address-info">
                                <div class="address-name">${addr.addressName || ''}${addr.default ? ' <span class="badge bg-success">Mặc định</span>' : ''}</div>
                                <div class="address-user">${addr.note ? addr.note + ' | ' : ''}${addr.phoneNumber || ''}</div>
                                <div class="address-text">${addr.fullAddress || ''}</div>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-info ms-2 btn-edit-address" data-id="${addr.userAddressId}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger ms-2 btn-delete-address" data-id="${addr.userAddressId}"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
                // Gán sự kiện chọn address
                document.querySelectorAll('.address-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        if (e.target.classList.contains('btn-delete-address')) return; // Không trigger khi bấm xóa
                        document.querySelectorAll('.address-item').forEach(i => i.classList.remove('selected'));
                        this.classList.add('selected');
                        const radio = this.querySelector('input[type="radio"]');
                        if (radio) radio.checked = true;
                    });
                });
                // Gán sự kiện xóa
                document.querySelectorAll('.btn-delete-address').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');
                        if (confirm('Bạn chắc chắn muốn xóa địa chỉ này?')) {
                            fetch(`/api/user-addresses/${id}`, { method: 'DELETE' })
                                .then(res => res.ok ? fetchAddresses() : alert('Không thể xóa địa chỉ!'));
                        }
                    });
                });

                window.addressList = addresses;
                document.querySelectorAll('.btn-edit-address').forEach(btn => {
                    btn.onclick = function() {
                        const id = this.getAttribute('data-id');
                        const address = window.addressList.find(addr => addr.userAddressId == id);
                        if (address) openEditAddressModal(address);
                    };
                });

                // Thêm địa chỉ mới (ví dụ đơn giản, bạn có thể mở modal nhập form)
                const btnAddAddress = document.getElementById('btnAddAddress');
                if (btnAddAddress) {
                    btnAddAddress.onclick = function() {
                        console.log("Thêm địa chỉ mới được nhấn");
                        const modalLabel = document.getElementById('addressEditModalLabel');
                        const addressEditForm = document.getElementById('addressEditForm');
                        const editAddressId = document.getElementById('editAddressId');
                        const addressEditModal = document.getElementById('addressEditModal');
                        if (modalLabel) modalLabel.textContent = 'Thêm địa chỉ mới';
                        if (addressEditForm) addressEditForm.reset();
                        if (editAddressId) editAddressId.value = '';
                        if (addressEditModal) new bootstrap.Modal(addressEditModal).show();
                        if (addressEditForm) {
                            addressEditForm.onsubmit = function(e) {
                                e.preventDefault();

                                console.log("Form debugged!");

                                const id = document.getElementById('editAddressId').value;
                                const data = {
                                    addressName: document.getElementById('editAddressName').value,
                                    phoneNumber: document.getElementById('editPhoneNumber').value,
                                    addressLine1: document.getElementById('editAddressLine1').value,
                                    addressLine2: document.getElementById('editAddressLine2').value,
                                    ward: document.getElementById('editWard').value,
                                    city: document.getElementById('editCity').value,
                                    note: document.getElementById('editNote').value
                                };
                                let url = `/api/user-addresses/add`;
                                let method = 'POST';
                                let params = new URLSearchParams({
                                    addressName: document.getElementById('editAddressName').value,
                                    phoneNumber: document.getElementById('editPhoneNumber').value,
                                    addressLine1: document.getElementById('editAddressLine1').value,
                                    addressLine2: document.getElementById('editAddressLine2').value,
                                    ward: document.getElementById('editWard').value,
                                    city: document.getElementById('editCity').value,
                                    note: document.getElementById('editNote').value
                                }).toString();

                                if (id) {
                                    url = `/api/user-addresses/update/${id}`;
                                    method = 'POST';
                                }

                                fetch(url, {
                                    method: method,
                                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                    body: params
                                })
                                .then(res => res.ok ? fetchAddresses() : alert('Không thể lưu địa chỉ!'));
                            };
                        }
                    };
                }
            }

            function openEditAddressModal(address) {
                const modalLabel = document.getElementById('addressEditModalLabel');
                const editAddressId = document.getElementById('editAddressId');
                const editAddressName = document.getElementById('editAddressName');
                const editPhoneNumber = document.getElementById('editPhoneNumber');
                const editAddressLine1 = document.getElementById('editAddressLine1');
                const editAddressLine2 = document.getElementById('editAddressLine2');
                const editWard = document.getElementById('editWard');
                const editCity = document.getElementById('editCity');
                const editNote = document.getElementById('editNote');
                const addressEditModal = document.getElementById('addressEditModal');

                if (modalLabel) modalLabel.textContent = 'Cập nhật địa chỉ';
                if (editAddressId) editAddressId.value = address.userAddressId;
                if (editAddressName) editAddressName.value = address.addressName || '';
                if (editPhoneNumber) editPhoneNumber.value = address.phoneNumber || '';
                if (editAddressLine1) editAddressLine1.value = address.addressLine1 || '';
                if (editAddressLine2) editAddressLine2.value = address.addressLine2 || '';
                if (editWard) editWard.value = address.ward || '';
                if (editCity) editCity.value = address.city || '';
                if (editNote) editNote.value = address.note || '';
                if (addressEditModal) new bootstrap.Modal(addressEditModal).show();
            }

            // Hàm lấy danh sách địa chỉ
            function fetchAddresses() {
                fetch(`/api/user-addresses`)
                    .then(res => res.json())
                    .then(renderAddresses)
                    .catch(() => {
                        const container = document.getElementById('savedAddresses');
                        if (container) container.innerHTML = '<div class="text-danger">Không thể tải địa chỉ.</div>';
                    });
            }
            
            // Xử lý đặt hàng và hiện popup chọn địa chỉ
            function handleCheckout() {
                console.log("Handle checkout called");
                
                
            

            

            // Khi mở popup thì load lại địa chỉ
            const addressPopup = document.getElementById('addressPopup');
            if (addressPopup) {
                addressPopup.addEventListener('transitionend', function() {
                    if (addressPopup.classList.contains('active')) fetchAddresses();
                });
            }

            // Khi xác nhận đặt hàng
            document.getElementById('confirmAddress')?.addEventListener('click', function() {
                const selected = document.querySelector('input[name="selectedAddress"]:checked');
                const note = document.getElementById('note').value;
                if (!selected) {
                    alert('Vui lòng chọn địa chỉ giao hàng!');
                    return;
                }
                const addressId = selected.value;
                // TODO: Gửi addressId và note lên server khi đặt hàng
                alert('Đặt hàng với địa chỉ ID: ' + addressId + '\nGhi chú: ' + note);
                addressPopup.classList.remove('active');
                document.body.style.overflow = '';
            });

            // Khi hủy
            document.getElementById('cancelAddress')?.addEventListener('click', function() {
                addressPopup.classList.remove('active');
                document.body.style.overflow = '';
            });

            // Khi đóng popup
            document.getElementById('addressClose')?.addEventListener('click', function() {
                addressPopup.classList.remove('active');
                document.body.style.overflow = '';
            });

            // Lần đầu load nếu popup đã mở
            if (addressPopup && addressPopup.classList.contains('active')) fetchAddresses();

                
                // Kiểm tra xem phần tử có tồn tại không
                if (addressPopup) {
                    // Thêm class active để hiển thị popup
                    addressPopup.classList.add('active');
                    
                    // Chặn cuộn trang
                    document.body.style.overflow = 'hidden';
                    
                    console.log("Address popup activated with class:", addressPopup.className);
                } else {
                    console.error("Address popup element not found");
                }
                
                return false; // Ngăn chặn chuyển hướng trang
            }

            // Lấy giỏ hàng từ server
            function fetchCart() {
                fetch('/api/cart')
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.json();
                    })
                    .then(updateCartUI)
                    .catch(() => updateCartUI([]));
            }

            // Thêm sản phẩm vào giỏ hàng
            window.addToCart = function(productId, name, price, imageUrl, restaurantName) {
                fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `productId=${productId}&quantity=1`
                })
                .then(res => {
                    if (!res.ok) throw new Error();
                    showToast('Đã thêm sản phẩm vào giỏ hàng!');
                    fetchCart();
                })
                .catch(() => showToast('Không thể thêm sản phẩm!', 'error'));
            };

            // Tăng số lượng
            function increaseQuantity(cartItemId) {
                changeQuantity(cartItemId, 1);
            }

            // Giảm số lượng
            function decreaseQuantity(cartItemId) {
                changeQuantity(cartItemId, -1);
            }

            // Đổi số lượng (tăng/giảm)
            function changeQuantity(cartItemId, delta) {
                // Lấy số lượng hiện tại từ DOM
                const quantityEl = document.querySelector(`#cart-quantity-${cartItemId}`);
                let current = parseInt(quantityEl.textContent);
                let newQuantity = current + delta;
                if (newQuantity < 1) return;
                fetch('/api/cart/change', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `cartItemId=${cartItemId}&quantity=${newQuantity}`
                })
                .then(res => {
                    if (!res.ok) throw new Error();
                    fetchCart();
                })
                .catch(() => showToast('Không thể cập nhật số lượng!', 'error'));
            }

            // Xóa sản phẩm khỏi giỏ hàng
            function removeFromCart(cartItemId) {
                fetch('/api/cart/remove?cartItemId=' + cartItemId, { method: 'DELETE' })
                    .then(res => {
                        if (!res.ok) throw new Error();
                        fetchCart();
                    })
                    .catch(() => showToast('Không thể xóa sản phẩm!', 'error'));
            }

            // Cập nhật giao diện giỏ hàng
            function updateCartUI(cartItems) {
                cartItems = cartItems || [];
                // Cập nhật số lượng badge
                const cartBadge = document.querySelector('.cart-badge');
                if (cartBadge) {
                    cartBadge.textContent = cartItems.reduce((sum, item) => sum + item.quantity, 0);
                }
                // Cập nhật nội dung giỏ hàng
                const cartBody = document.querySelector('.cart-body');
                if (cartBody) {
                    if (cartItems.length === 0) {
                        cartBody.innerHTML = `<div class="empty-cart"><p>Giỏ hàng của bạn đang trống</p></div>`;
                    } else {
                        let cartItemsHTML = '';
                        cartItems.forEach(item => {
                            cartItemsHTML += `
                                <div class="cart-item">
                                    <img src="${item.productImageUrl}" alt="${item.productName}" class="item-image">
                                    <div class="item-details">
                                        <div class="item-name">${item.productName}</div>
                                        <div class="item-price">${formatCurrency(item.productPrice)} VNĐ</div>
                                    </div>
                                    <div class="quantity-controls">
                                        <button class="quantity-btn" onclick="decreaseQuantity(${item.cartItemId})">-</button>
                                        <span class="quantity-display" id="cart-quantity-${item.cartItemId}">${item.quantity}</span>
                                        <button class="quantity-btn" onclick="increaseQuantity(${item.cartItemId})">+</button>
                                    </div>
                                    <button class="remove-item-btn" onclick="removeFromCart(${item.cartItemId})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            `;
                        });
                        cartBody.innerHTML = cartItemsHTML;
                    }
                }
                // Cập nhật tổng tiền
                const cartFooter = document.querySelector('.cart-footer');
                if (cartFooter) {
                    if (cartItems.length === 0) {
                        cartFooter.style.display = 'none';
                    } else {
                        cartFooter.style.display = 'block';
                        const total = cartItems.reduce((sum, item) => sum + item.productPrice * item.quantity, 0);
                        const totalEl = cartFooter.querySelector('.cart-total span:last-child');
                        if (totalEl) {
                            totalEl.textContent = `${formatCurrency(total)} VNĐ`;
                        }
                    }
                }
            }

            // Định dạng tiền tệ
            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN').format(amount);
            }

            // Hiển thị thông báo
            function showToast(message, type = 'success') {
                // Xóa toast cũ nếu có
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    document.body.removeChild(existingToast);
                }
                
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (document.body.contains(toast)) {
                            document.body.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }

            fetchCart();

            
            
        </script>
        <th:block layout:fragment="script"></th:block>
    </body>
</html>
