<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shoppie Food</title>
        
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 🎨 EXTERNAL STYLESHEETS & FONTS                                     -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 🎯 CUSTOM STYLESHEETS                                               -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <link rel="stylesheet" th:href="@{/css/base/color.css}">
        <link rel="stylesheet" th:href="@{/css/components/navbar.css}">
        <link rel="stylesheet" th:href="@{/css/components/sidebar.css}">
        <link rel="stylesheet" th:href="@{/css/components/cart.css}">
        <link rel="stylesheet" th:href="@{/css/components/products.css}">
        <link rel="stylesheet" th:href="@{/css/objects/auth.css}">
        <link rel="stylesheet" th:href="@{/css/objects/food.css}">
        <link rel="stylesheet" th:href="@{/css/objects/order.css}">
        <link rel="stylesheet" th:href="@{/css/objects/user.css}">
        <link rel="stylesheet" th:href="@{/css/misc.css}">
        <th:block layout:fragment="css"></th:block>
    </head>
    
    <body>
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 🔲 FLOATING SIDEBAR COMPONENT                                       -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <div id="floatingSidebar" class="floating-sidebar">
            <button id="sidebarCloseBtn" class="sidebar-close-btn">
                <img src="/images/icons/sidebar.png" alt="Sidebar" style="width: 32px; height: 32px; border: none !important; background: transparent !important;">
            </button>
            <div th:replace="~{shared/fragments/sidebar :: sidebar}"></div>            
        </div>
        
        <!-- Overlay for mobile -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 📱 MAIN CONTENT WRAPPER                                             -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <div class="content-wrapper">
            <div th:replace="~{shared/fragments/navbar :: navbar}"></div>
            <div class="main-content">
                <div layout:fragment="content"></div>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 📍 ADDRESS POPUP FRAGMENT                                           -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <div th:replace="~{shared/fragments/address-popup :: address-popup}"></div>

        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <!-- 📦 EXTERNAL SCRIPTS                                                 -->
        <!-- ═══════════════════════════════════════════════════════════════════ -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            // ═══════════════════════════════════════════════════════════════════
            // 🚀 MAIN INITIALIZATION
            // ═══════════════════════════════════════════════════════════════════
            document.addEventListener('DOMContentLoaded', function() {
                console.log("DOM fully loaded - initializing components");
                
                initializeSidebar();
                initializeCart();
                initializeAddressPopup();
                updateCartUI();
                fetchCart();
            });

            // ═══════════════════════════════════════════════════════════════════
            // 📲 SIDEBAR FUNCTIONALITY
            // ═══════════════════════════════════════════════════════════════════
            function initializeSidebar() {
                const floatingSidebar = document.getElementById('floatingSidebar');
                const sidebarOverlay = document.getElementById('sidebarOverlay');
                const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
                const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
                
                // Open sidebar event
                if (sidebarToggleBtn) {
                    sidebarToggleBtn.addEventListener('click', function(event) {
                        event.preventDefault();
                        openSidebar();
                    });
                }
                
                // Close sidebar events
                if (sidebarCloseBtn) {
                    sidebarCloseBtn.addEventListener('click', closeSidebar);
                }
                
                if (sidebarOverlay) {
                    sidebarOverlay.addEventListener('click', closeSidebar);
                }

                function openSidebar() {
                    floatingSidebar.classList.add('active');
                    sidebarOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeSidebar() {
                    floatingSidebar.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            // ═══════════════════════════════════════════════════════════════════
            // 🛒 CART FUNCTIONALITY
            // ═══════════════════════════════════════════════════════════════════
            function initializeCart() {
                const cartToggle = document.getElementById('cartToggle');
                const cartPopup = document.getElementById('cartPopup');
                const cartClose = document.getElementById('cartClose');
                const hideCartBtn = document.getElementById('hideCart');
                const cartOverlay = document.getElementById('cartOverlay');

                // Open cart
                if (cartToggle && cartPopup) {
                    cartToggle.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        openCart();
                    });
                }

                // Close cart events
                if (cartClose) cartClose.addEventListener('click', closeCart);
                if (hideCartBtn) hideCartBtn.addEventListener('click', closeCart);
                if (cartOverlay) cartOverlay.addEventListener('click', closeCart);

                // Prevent popup from closing when clicking inside
                if (cartPopup) {
                    cartPopup.addEventListener('click', function(e) {
                        e.stopPropagation();
                    });
                }

                // Close popup when clicking outside
                document.addEventListener('click', function(e) {
                    if (cartPopup && cartPopup.classList.contains('active') && 
                        !cartPopup.contains(e.target) && 
                        !cartToggle.contains(e.target)) {
                        cartPopup.classList.remove('active');
                    }
                });

                function openCart() {
                    cartPopup.classList.add('active');
                    cartOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeCart() {
                    cartPopup.classList.remove('active');
                    cartOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            // ═══════════════════════════════════════════════════════════════════
            // 📍 ADDRESS POPUP FUNCTIONALITY
            // ═══════════════════════════════════════════════════════════════════
            function initializeAddressPopup() {
                const checkoutBtn = document.getElementById('checkoutBtn');
                const addressPopup = document.getElementById('addressPopup');
                const addressClose = document.getElementById('addressClose');
                const cancelAddress = document.getElementById('cancelAddress');
                const confirmAddress = document.getElementById('confirmAddress');

                // Open address popup from checkout
                if (checkoutBtn && addressPopup) {
                    checkoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        // Close cart popup first
                        const cartPopup = document.getElementById('cartPopup');
                        const cartOverlay = document.getElementById('cartOverlay');
                        if (cartPopup) cartPopup.classList.remove('active');
                        if (cartOverlay) cartOverlay.classList.remove('active');
                        
                        // Open address popup
                        addressPopup.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        fetchAddresses();
                        return false;
                    });
                }
                
                // Close address popup events
                if (addressClose) {
                    addressClose.addEventListener('click', closeAddressPopup);
                }
                
                if (cancelAddress) {
                    cancelAddress.addEventListener('click', closeAddressPopup);
                }

                // Close popup by clicking outside
                if (addressPopup) {
                    addressPopup.addEventListener('click', function(e) {
                        if (e.target === addressPopup) {
                            closeAddressPopup();
                        }
                    });
                }
                
                // Close popup with X button
                const closePopupX = document.querySelector('.popup-header .popup-close-btn');
                if (closePopupX) {
                    closePopupX.addEventListener('click', closeAddressPopup);
                }
                
                // Confirm order
                if (confirmAddress) {
                    confirmAddress.addEventListener('click', handleOrderConfirmation);
                }

                function closeAddressPopup() {
                    addressPopup.classList.remove('active');
                    document.body.style.overflow = '';
                }

                function handleOrderConfirmation() {
                    const selectedAddress = document.querySelector('input[name="selectedAddress"]:checked');
                    const note = document.getElementById('note').value;
                    
                    if (selectedAddress) {
                        const addressId = selectedAddress.value;
                        const addressInfo = document.querySelector(`#address${addressId}`).closest('.address-item').querySelector('.address-text').textContent;
                        
                        console.log('Order information:', {
                            addressId,
                            addressInfo,
                            note
                        });
                        
                        showToast('Order placed successfully! Thank you for your purchase.');
                        closeAddressPopup();
                        
                        // Close cart
                        const cartPopup = document.getElementById('cartPopup');
                        if (cartPopup) cartPopup.classList.remove('active');
                    } else {
                        showToast('Please select a delivery address', 'error');
                    }
                }
            }

            // ═══════════════════════════════════════════════════════════════════
            // 📍 ADDRESS MANAGEMENT
            // ═══════════════════════════════════════════════════════════════════
            // Fetch and render addresses
            function fetchAddresses() {
                fetch('/api/user-addresses')
                    .then(res => res.json())
                    .then(data => {
                        // data.addresses is the array, data.defaultAddress is the default
                        renderAddresses(data.addresses, data.defaultAddress);
                    })
                    .catch(() => {
                        const container = document.getElementById('savedAddresses');
                        if (container) container.innerHTML = '<div class="text-danger">Cannot load addresses.</div>';
                    });
            }

            function renderAddresses(addresses, defaultAddress) {
                const container = document.getElementById('savedAddresses');
                if (!container) return;

                if (!addresses || addresses.length === 0) {
                    container.innerHTML = `<div class="text-muted px-2 py-2">You don't have any addresses yet.</div>`;
                    return;
                }

                container.innerHTML = addresses.map(addr => `
                    <div class="address-item${defaultAddress && addr.userAddressId === defaultAddress.userAddressId ? ' selected' : ''}">
                        <div class="address-radio">
                            <input type="radio" name="selectedAddress" id="address${addr.userAddressId}" value="${addr.userAddressId}" ${defaultAddress && addr.userAddressId === defaultAddress.userAddressId ? 'checked' : ''}>
                            <label for="address${addr.userAddressId}"></label>
                        </div>
                        <div class="address-content">
                            <div class="address-info">
                                <div class="address-name">${addr.addressName || ''}${defaultAddress && addr.userAddressId === defaultAddress.userAddressId ? ' <span class="badge bg-success">Default</span>' : ''}</div>
                                <div class="address-user">${addr.note ? addr.note + ' | ' : ''}${addr.phoneNumber || ''}</div>
                                <div class="address-text">${addr.fullAddress || ''}</div>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-info ms-2 btn-edit-address" data-id="${addr.userAddressId}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger ms-2 btn-delete-address" data-id="${addr.userAddressId}"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');

                attachAddressEvents(addresses, defaultAddress);
            }

            function attachAddressEvents(addresses, defaultAddress) {
                // Select address events
                document.querySelectorAll('.address-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        if (e.target.classList.contains('btn-delete-address')) return;
                        document.querySelectorAll('.address-item').forEach(i => i.classList.remove('selected'));
                        this.classList.add('selected');
                        const radio = this.querySelector('input[type="radio"]');
                        if (radio) radio.checked = true;
                    });
                });

                // Delete address events
                document.querySelectorAll('.btn-delete-address').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.getAttribute('data-id');
                        if (confirm('Are you sure you want to delete this address?')) {
                            fetch(`/api/user-addresses/delete/${id}`, { method: 'DELETE' })
                                .then(res => res.ok ? fetchAddresses() : alert('Cannot delete address!'));
                        }
                    });
                });

                // Edit address events
                window.addressList = addresses;
                document.querySelectorAll('.btn-edit-address').forEach(btn => {
                    btn.onclick = function() {
                        const id = this.getAttribute('data-id');
                        const address = window.addressList.find(addr => addr.userAddressId == id);
                        if (address) openEditAddressModal(address);
                    };
                });

                // Add new address
                const btnAddAddress = document.getElementById('btnAddAddress');
                if (btnAddAddress) {
                    btnAddAddress.onclick = function() {
                        setupAddressModal(null);
                    };
                }
            }

            function setupAddressModal(address) {
                const modalLabel = document.getElementById('addressEditModalLabel');
                const addressEditForm = document.getElementById('addressEditForm');
                const editAddressId = document.getElementById('editAddressId');
                const addressEditModal = document.getElementById('addressEditModal');

                if (modalLabel) modalLabel.textContent = address ? 'Update Address' : 'Add New Address';
                if (addressEditForm) addressEditForm.reset();
                if (editAddressId) editAddressId.value = address ? address.userAddressId : '';

                if (address) fillAddressForm(address);

                if (addressEditModal) new bootstrap.Modal(addressEditModal).show();

                if (addressEditForm) {
                    addressEditForm.onsubmit = handleAddressFormSubmit;
                }
            }

            function openEditAddressModal(address) {
                setupAddressModal(address);
            }

            function fillAddressForm(address) {
                const fields = ['editAddressName', 'editPhoneNumber', 'editAddressLine1', 'editAddressLine2', 'editWard', 'editCity', 'editNote'];
                const values = [address.addressName, address.phoneNumber, address.addressLine1, address.addressLine2, address.ward, address.city, address.note];

                fields.forEach((fieldId, index) => {
                    const field = document.getElementById(fieldId);
                    if (field) field.value = values[index] || '';
                });
            }

            function handleAddressFormSubmit(e) {
                e.preventDefault();
                const id = document.getElementById('editAddressId').value;
                const addressData = {
                    addressName: document.getElementById('editAddressName').value,
                    phoneNumber: document.getElementById('editPhoneNumber').value,
                    addressLine1: document.getElementById('editAddressLine1').value,
                    addressLine2: document.getElementById('editAddressLine2').value,
                    ward: document.getElementById('editWard').value,
                    city: document.getElementById('editCity').value,
                    note: document.getElementById('editNote').value
                };
                const url = id ? `/api/user-addresses/update/${id}` : `/api/user-addresses/add`;
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(addressData)
                })
                .then(res => {
                    if (res.ok) {
                        fetchAddresses();
                        // Hide the modal after successful save
                        const addressEditModal = document.getElementById('addressEditModal');
                        if (addressEditModal) {
                            const modal = bootstrap.Modal.getInstance(addressEditModal) || new bootstrap.Modal(addressEditModal);
                            modal.hide();
                        }
                    } else {
                        alert('Cannot save address!');
                    }
                });
            }

            // ═══════════════════════════════════════════════════════════════════
            // 🛒 CART API OPERATIONS
            // ═══════════════════════════════════════════════════════════════════
            function fetchCart() {
                fetch('/api/cart/user')
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.json();
                    })
                    .then(updateCartUI)
                    .catch(() => updateCartUI([]));
            }

            window.addToCart = function(productId, name, price, imageUrl, restaurantName) {
                fetch('/api/cart/user/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `productId=${productId}&quantity=1`
                })
                .then(res => {
                    if (!res.ok) throw new Error();
                    showToast('Product added to cart!');
                    fetchCart();
                })
                .catch(() => showToast('Cannot add product!', 'error'));
            };

            function increaseQuantity(cartItemId) {
                const quantityEl = document.querySelector(`#cart-quantity-${cartItemId}`);
                let current = parseInt(quantityEl.textContent);
                let newQuantity = current + 1;
                changeQuantity(cartItemId, newQuantity);
            }

            function decreaseQuantity(cartItemId) {
                const quantityEl = document.querySelector(`#cart-quantity-${cartItemId}`);
                let current = parseInt(quantityEl.textContent);
                let newQuantity = current - 1;
                if (newQuantity < 1) return;
                changeQuantity(cartItemId, newQuantity);
            }

            function changeQuantity(cartItemId, newQuantity) {
                fetch(`/api/cart/change/${cartItemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `quantity=${newQuantity}`
                })
                .then(res => {
                    if (!res.ok) throw new Error();
                    fetchCart();
                })
                .catch(() => showToast('Cannot update quantity!', 'error'));
            }

            function removeFromCart(cartItemId) {
                fetch(`/api/cart/remove/${cartItemId}`, { method: 'DELETE' })
                    .then(res => {
                        if (!res.ok) throw new Error();
                        fetchCart();
                    })
                    .catch(() => showToast('Cannot remove product!', 'error'));
            }

            // ═══════════════════════════════════════════════════════════════════
            // 🎨 UI UPDATE FUNCTIONS
            // ═══════════════════════════════════════════════════════════════════
            function updateCartUI(cartItems) {
                cartItems = cartItems || [];
                updateCartBadge(cartItems);
                updateCartBody(cartItems);
                updateCartFooter(cartItems);
            }

            function updateCartBadge(cartItems) {
                const cartBadge = document.querySelector('.cart-badge');
                if (cartBadge) {
                    cartBadge.textContent = cartItems.reduce((sum, item) => sum + item.quantity, 0);
                }
            }

            function updateCartBody(cartItems) {
                const cartBody = document.querySelector('.cart-body');
                if (!cartBody) return;
                
                if (cartItems.length === 0) {
                    cartBody.innerHTML = `<div class="empty-cart"><p>Your cart is empty</p></div>`;
                } else {
                    let cartItemsHTML = '';
                    cartItems.forEach(item => {
                        cartItemsHTML += `
                            <div class="cart-item">
                                <img src="${item.productImageUrl}" alt="${item.productName}" class="item-image">
                                <div class="item-details">
                                    <div class="item-name">${item.productName}</div>
                                    <div class="item-price">${formatCurrency(item.productPrice)} VNĐ</div>
                                </div>
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="decreaseQuantity(${item.cartItemId})">-</button>
                                    <span class="quantity-display" id="cart-quantity-${item.cartItemId}">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="increaseQuantity(${item.cartItemId})">+</button>
                                </div>
                                <button class="remove-item-btn" onclick="removeFromCart(${item.cartItemId})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    });
                    cartBody.innerHTML = cartItemsHTML;
                }
            }

            function updateCartFooter(cartItems) {
                const cartFooter = document.querySelector('.cart-footer');
                if (!cartFooter) return;
                
                if (cartItems.length === 0) {
                    cartFooter.style.display = 'none';
                } else {
                    cartFooter.style.display = 'block';
                    const total = cartItems.reduce((sum, item) => sum + item.productPrice * item.quantity, 0);
                    const totalEl = cartFooter.querySelector('.cart-total span:last-child');
                    if (totalEl) {
                        totalEl.textContent = `${formatCurrency(total)} VNĐ`;
                    }
                }
            }

            // ═══════════════════════════════════════════════════════════════════
            // 🔧 UTILITY FUNCTIONS
            // ═══════════════════════════════════════════════════════════════════
            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN').format(amount);
            }

            function showToast(message, type = 'success') {
                // Remove existing toast
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    document.body.removeChild(existingToast);
                }
                
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('show');
                }, 10);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (document.body.contains(toast)) {
                            document.body.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }
        </script>
        <th:block layout:fragment="script"></th:block>
    </body>
</html>
